<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>푸른 순환 — 생태계 수족관</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#04121f; }
  #sea { display:block; width:100vw; height:100vh; touch-action:none; }
  #hud {
    position:fixed; top:12px; left:12px; z-index:10;
    background:rgba(4,24,40,.62); backdrop-filter:blur(6px);
    border:1px solid rgba(120,200,255,.18); border-radius:12px;
    color:#cfe9f7; font-family:-apple-system,'Pretendard','Noto Sans KR',sans-serif;
    padding:10px 14px; font-size:13px; line-height:1.5; user-select:none;
    min-width:150px;
  }
  #hud h1 { margin:0 0 2px; font-size:15px; font-weight:700; color:#eaf6ff; letter-spacing:.02em; }
  #hud .ver { font-size:11px; color:#7fb6d9; margin-bottom:6px; }
  #hud .stat { display:flex; justify-content:space-between; gap:14px; }
  #hud .stat b { font-weight:600; color:#fff; font-variant-numeric:tabular-nums; }
  #hud .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  #controls { margin-top:8px; display:flex; gap:6px; }
  #controls button {
    flex:1; background:rgba(80,170,220,.16); color:#bfe4f7; border:1px solid rgba(120,200,255,.25);
    border-radius:8px; padding:5px 0; font-size:12px; cursor:pointer; font-family:inherit;
  }
  #controls button:hover { background:rgba(80,170,220,.3); }
  #controls button.on { background:rgba(90,200,180,.28); border-color:rgba(90,220,190,.5); color:#d8fff4; }
  #log {
    position:fixed; left:12px; bottom:12px; z-index:10; max-width:70vw;
    font-family:-apple-system,'Pretendard','Noto Sans KR',sans-serif;
    font-size:11px; color:rgba(180,220,240,.75); line-height:1.6; pointer-events:none;
    text-shadow:0 1px 3px rgba(0,0,0,.6);
  }
  #dash {
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    height:64vh; transform:translateY(102%); transition:transform .28s ease;
    background:rgba(3,18,30,.92); backdrop-filter:blur(10px);
    border-top:1px solid rgba(120,200,255,.25); border-radius:18px 18px 0 0;
    color:#cfe9f7; font-family:-apple-system,'Pretendard','Noto Sans KR',sans-serif;
    overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 16px 26px;
  }
  #dash.open { transform:translateY(0); }
  #dashHead {
    position:sticky; top:0; z-index:2; display:flex; justify-content:space-between; align-items:center;
    background:rgba(3,18,30,.96); padding:12px 2px 10px; font-size:15px; font-weight:700; color:#eaf6ff;
    border-bottom:1px solid rgba(120,200,255,.12);
  }
  #btnDashClose {
    background:rgba(80,170,220,.16); color:#bfe4f7; border:1px solid rgba(120,200,255,.25);
    border-radius:8px; padding:5px 14px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  #dash .sec { margin-top:18px; }
  #dash .secT { font-size:12px; color:#7fb6d9; margin-bottom:8px; letter-spacing:.02em; }
  #dash canvas.chart { width:100%; display:block; background:rgba(10,35,55,.4); border-radius:10px; }
  #dash .leg { display:flex; flex-wrap:wrap; gap:12px; margin-top:6px; font-size:11px; color:#a9cede; }
  #dash .leg .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }
  #dash .gstat { display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; font-size:12.5px; }
  #dash .gstat .row { display:flex; justify-content:space-between; background:rgba(10,35,55,.4); border-radius:8px; padding:7px 10px; }
  #dash .gstat .row b { color:#fff; font-variant-numeric:tabular-nums; }
  #dashLog { font-size:12px; line-height:1.75; color:#a9cede; }
  #dexGrid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  #dexGrid .m { display:flex; align-items:center; gap:7px; background:rgba(10,35,55,.4); border-radius:8px; padding:6px 8px; font-size:11px; color:#a9cede; }
  #dexGrid .m .dot { flex:none; width:14px; height:14px; border-radius:50%; box-shadow:0 0 6px rgba(255,255,255,.25) inset; }
  #dexGrid .m .nm { color:#dceef8; }
  #dexGrid .m .rr { margin-left:auto; flex:none; font-size:9.5px; padding:1px 6px; border-radius:6px; }
  .rr.c0 { background:rgba(120,150,170,.25); color:#9fb8c8; }
  .rr.c1 { background:rgba(80,160,120,.3); color:#9fe0b8; }
  .rr.c2 { background:rgba(70,130,220,.35); color:#a9ccff; }
  .rr.c3 { background:rgba(200,120,40,.4); color:#ffd9a0; }
  #inspect {
    position:fixed; left:16px; right:16px; bottom:16px; z-index:5;
    background:rgba(8,26,42,.92); border:1px solid rgba(130,200,240,.35); border-radius:12px;
    padding:10px 12px; font-size:12px; color:#a9cede; display:none; backdrop-filter:blur(4px);
  }
  #inspect.show { display:block; }
  #inspect .ih { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  #inspect .idot { width:16px; height:16px; border-radius:50%; }
  #inspect .inm { color:#fff; font-weight:700; }
  #inspect .ix { margin-left:auto; background:none; border:1px solid rgba(130,200,240,.4); color:#a9cede; border-radius:8px; padding:2px 9px; font-size:11px; cursor:pointer; }
  #inspect .igrid { display:grid; grid-template-columns:1fr 1fr; gap:3px 12px; font-variant-numeric:tabular-nums; }
  #inspect .igrid b { color:#dceef8; font-weight:600; }
  #dashLog .d { color:#5f96b5; margin-right:6px; font-variant-numeric:tabular-nums; }
  /* 저장 모달 · 정산 카드 (v0.6) */
  #saveModal {
    position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center;
    background:rgba(2,8,16,.6); backdrop-filter:blur(3px);
  }
  #saveModal.show { display:flex; }
  #saveBox {
    width:min(340px, calc(100vw - 32px)); background:rgba(8,26,42,.97); border:1px solid rgba(130,200,240,.35);
    border-radius:14px; padding:14px; font-size:12.5px; color:#a9cede;
  }
  #saveBox h2 { margin:0 0 10px; font-size:15px; color:#fff; }
  #saveBox .slot { background:rgba(10,35,55,.5); border-radius:10px; padding:9px 10px; margin-bottom:8px; }
  #saveBox .slot .st { display:flex; justify-content:space-between; align-items:center; }
  #saveBox .slot .si { color:#7fb6d9; font-size:11px; margin-top:2px; min-height:14px; }
  #saveBox .sbtn { background:rgba(70,130,180,.3); border:1px solid rgba(130,200,240,.4); color:#dceef8; border-radius:8px; padding:3px 10px; font-size:11.5px; cursor:pointer; margin-left:6px; }
  #saveBox .sbtn.warn { border-color:rgba(240,160,120,.5); color:#ffc9a8; }
  #saveBox .foot { display:flex; justify-content:space-between; margin-top:10px; }
  #settle {
    position:fixed; left:16px; right:16px; top:30%; z-index:25; display:none;
    background:rgba(8,26,42,.95); border:1px solid rgba(130,200,240,.4); border-radius:14px;
    padding:14px; font-size:12.5px; color:#a9cede; line-height:1.7;
  }
  #settle.show { display:block; }
  #settle h3 { margin:0 0 6px; font-size:14px; color:#fff; }
  #settle b { color:#dceef8; }
  #settle button { margin-top:10px; width:100%; background:rgba(70,130,180,.35); border:1px solid rgba(130,200,240,.45); color:#fff; border-radius:9px; padding:7px; font-size:13px; cursor:pointer; }
  #hint {
    position:fixed; right:12px; bottom:12px; z-index:10;
    font-family:-apple-system,'Pretendard','Noto Sans KR',sans-serif;
    font-size:11px; color:rgba(150,200,225,.55); pointer-events:none;
  }
</style>
</head>
<body>
<canvas id="sea"></canvas>
<div id="hud">
  <h1>푸른 순환</h1>
  <div class="ver">생태계 수족관 · v0.6 · <span id="cFps">--</span>fps</div>
  <div class="stat"><span><span class="dot" style="background:#69d67c"></span>조류</span><b id="cAlgae">0</b></div>
  <div class="stat"><span><span class="dot" style="background:#8fd3e8"></span>초식어</span><b id="cHerb">0</b></div>
  <div class="stat"><span><span class="dot" style="background:#f0918a"></span>포식자</span><b id="cPred">0</b></div>
  <div class="stat"><span>경과</span><b id="cTime">0일</b></div>
  <div id="controls">
    <button id="btnPause">일시정지</button>
    <button id="btnSpeed">1×</button>
    <button id="btnFeed">먹이</button>
    <button id="btnDash">지표</button>
    <button id="btnSave">저장</button>
  </div>
</div>
<div id="inspect"></div>
<div id="settle"></div>
<div id="saveModal"><div id="saveBox"></div></div>
<div id="dash">
  <div id="dashHead"><span>생태계 지표</span><button id="btnDashClose">닫기</button></div>
  <div class="sec"><div class="secT">환경 상태</div><div class="gstat" id="envStats"></div></div>
  <div class="sec"><div class="secT">환경 추이 · 최근 5분</div><canvas id="chEnv" class="chart" height="110"></canvas><div class="leg" id="envLeg"></div></div>
  <div class="sec"><div class="secT">개체수 추이 · 최근 5분</div><canvas id="chLine" class="chart" height="132"></canvas><div class="leg" id="lineLeg"></div></div>
  <div class="sec"><div class="secT">생물량 비중</div><canvas id="chPie" class="chart" height="150"></canvas><div class="leg" id="pieLeg"></div></div>
  <div class="sec"><div class="secT">세대 · 기록</div><div class="gstat" id="genStats"></div></div>
  <div class="sec"><div class="secT">도감 · 발견한 형태 <span id="dexCount" style="color:#dceef8"></span></div><div id="dexGrid"></div></div>
  <div class="sec"><div class="secT">관찰 일지</div><div id="dashLog"></div></div>
</div>
<div id="log"></div>
<div id="hint">방치해도 생태계가 저절로 돌아갑니다</div>
<script>
'use strict';
/* ============================================================
   푸른 순환 v0.6 — 생태계 수족관 (저장·오프라인 정산)
   생산자(조류/수초) → 초식어 → 포식자, 개체 단위 시뮬레이션
   ============================================================ */
const canvas = document.getElementById('sea');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();

/* ---------- 유틸 ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const TAU = Math.PI * 2;

/* ---------- 공간 해시 (이웃 탐색) ---------- */
class Grid {
  constructor(cell) { this.cell = cell; this.map = new Map(); }
  key(x, y) { return ((x / this.cell) | 0) * 100000 + ((y / this.cell) | 0); }
  clear() { this.map.clear(); }
  add(o) {
    const k = this.key(o.x, o.y);
    let arr = this.map.get(k);
    if (!arr) { arr = []; this.map.set(k, arr); }
    arr.push(o);
  }
  near(x, y, r, out) {
    out.length = 0;
    const c = this.cell;
    const x0 = ((x - r) / c) | 0, x1 = ((x + r) / c) | 0;
    const y0 = ((y - r) / c) | 0, y1 = ((y + r) / c) | 0;
    for (let gx = x0; gx <= x1; gx++) for (let gy = y0; gy <= y1; gy++) {
      const arr = this.map.get(gx * 100000 + gy);
      if (arr) for (let i = 0; i < arr.length; i++) out.push(arr[i]);
    }
    return out;
  }
}
const herbGrid = new Grid(64);
const algaeGrid = new Grid(48);
const _near = [];

/* ---------- 환경 ---------- */
const env = {
  nutrients: 0.6,      // 0~1, 조류 성장 속도에 비례
  oxygen: 0.8,
  temp: 22,            // 수온 °C
  light: 1,            // 일광 강도 0~1 (낮밤 주기)
  bloom: 0,            // 조류 대발생 남은 초
  bloomCd: 0,          // 대발생 쿨다운
  predRescue: -1,      // 포식자 유입 카운트다운 (-1 = 대기 아님)
  t: 0,                // 시뮬레이션 누적 초
  day: 0,              // 경과 '일' (45초 = 1일)
};
const DAY_LEN = 45;
/* 낮밤 주기: 하루 45초, 한낮(p=0.5)에 최대, 자정(p=0/1)에 최소 */
function daylight(tt) {
  const p = (tt % DAY_LEN) / DAY_LEN;
  return clamp(0.10 + 0.90 * Math.max(0, Math.sin(p * Math.PI)) ** 1.2, 0, 1);
}
function phaseLabel() {
  const p = (env.t % DAY_LEN) / DAY_LEN;
  if (p < 0.16) return '새벽';
  if (p < 0.38) return '아침';
  if (p < 0.62) return '낮';
  if (p < 0.84) return '황혼';
  return '밤';
}

/* ---------- 통계 · 이력 (v0.3 대시보드) ---------- */
const stats = { births: 0, deaths: 0, hunts: 0, mutations: 0, maxGenHerb: 1, maxGenPred: 1 };
const HIST_MAX = 600; // 0.5초 × 600 = 5분
const hist = { a: [], h: [], p: [], o: [], tp: [] };
let histAcc = 0;

/* ---------- 도감 · 유전 (v0.5) ---------- */
const HUE_BANDS = [
  [15, '붉은'], [45, '주황'], [75, '황금'], [105, '연두'], [150, '초록'], [180, '청록'],
  [210, '하늘'], [240, '파란'], [270, '남빛'], [300, '보라'], [330, '자주'], [360, '붉은'],
];
function hueName(h) { for (const [lim, n] of HUE_BANDS) if (h < lim) return n; return '붉은'; }
function sizeName(v) { return v < 0.9 ? '작은' : v > 1.12 ? '큰' : ''; }
function speedName(v) { return v < 0.92 ? '느린' : v > 1.1 ? '빠른' : ''; }
const RARITY = ['흔함', '드묾', '희귀', '전설'];
function morphOf(kind, g) {
  const baseHue = kind === 'herb' ? 190 : 0;
  let hd = Math.abs(g.hue - baseHue); if (hd > 180) hd = 360 - hd;
  const dev = Math.abs(g.size - 1) / 0.45 + Math.abs(g.speed - 1) / 0.35 + hd / 120;
  const rarity = dev < 0.3 ? 0 : dev < 0.65 ? 1 : dev < 1.05 ? 2 : 3;
  const adj = [sizeName(g.size), speedName(g.speed)].filter(Boolean).join(' ');
  const sp = kind === 'herb' ? '초식어' : '포식어';
  return {
    key: kind + ':' + hueName(g.hue) + ':' + (sizeName(g.size) || '보통') + ':' + (speedName(g.speed) || '보통'),
    name: hueName(g.hue) + '빛' + (adj ? ' ' + adj : '') + ' ' + sp,
    rarity, hue: g.hue,
  };
}
const codex = new Map(); // key -> {name, rarity, hue, kind, firstDay, seen}
function recordMorph(kind, g) {
  if (restoring) return null;
  const m = morphOf(kind, g);
  const e = codex.get(m.key);
  if (e) { e.seen++; return e; }
  codex.set(m.key, { ...m, kind, firstDay: env.day, seen: 1 });
  if (m.rarity >= 2) addLog((m.rarity === 3 ? '전설의' : '희귀한') + ' 변이 발견: ' + m.name);
  return codex.get(m.key);
}

/* ---------- 조류 (부유 먹이 알갱이) ---------- */
const ALGAE_MAX = 260;
const algae = [];
function spawnAlgae(x, y, big) {
  if (algae.length >= ALGAE_MAX) return;
  algae.push({
    x: x !== undefined ? x : rand(10, W - 10),
    y: y !== undefined ? y : rand(H * 0.15, H * 0.9),
    vx: rand(-4, 4), vy: rand(-2, 2),
    r: big ? rand(3.2, 4.6) : rand(1.6, 3.0),
    e: big ? 26 : rand(10, 18),
    ph: rand(0, TAU),
  });
}

/* ---------- 수초 (바닥 생산자) ---------- */
const plants = [];
function makePlants() {
  plants.length = 0;
  const n = Math.max(6, (W / 90) | 0);
  for (let i = 0; i < n; i++) {
    plants.push({
      x: (i + rand(0.2, 0.8)) / n * W,
      blades: (rand(4, 8)) | 0,
      h: rand(50, Math.min(150, H * 0.28)),
      grow: rand(0.6, 1),
      ph: rand(0, TAU),
      spore: rand(2, 6),
    });
  }
}
makePlants();

/* ---------- 찌꺼기 (분해 → 영양염) ---------- */
const detritus = [];
function dropDetritus(x, y, amt) {
  detritus.push({ x, y, vy: rand(8, 16), amt, r: rand(1.5, 3) });
}

/* ---------- 물고기 공통 ---------- */
let nextGenId = 1;
function baseFish(x, y, genes) {
  return {
    x, y,
    vx: rand(-20, 20), vy: rand(-10, 10),
    dir: 1, ph: rand(0, TAU),
    energy: 55, age: 0,
    genes,
    id: nextGenId++,
    gen: 1,
    wobble: rand(0, TAU),
  };
}
function mutate(g, amt) {
  const m = { size: g.size, speed: g.speed, hue: g.hue };
  /* 약한 평균 회귀 — 대사 비용 폭주(고속화)를 막아 장기 안정성 확보 */
  m.size = clamp(m.size * 0.96 + 1.0 * 0.04 + rand(-amt, amt) * 0.14, 0.75, 1.45);
  m.speed = clamp(m.speed * 0.95 + 1.0 * 0.05 + rand(-amt, amt) * 0.16, 0.75, 1.35);
  m.hue = (m.hue + rand(-amt, amt) * 26 + 360) % 360;
  return m;
}

/* ---------- 초식어 ---------- */
const HERB_MAX = 220;
const herbs = [];
function spawnHerb(x, y, genes, gen) {
  if (herbs.length >= HERB_MAX) return null;
  const g = genes || { size: rand(0.85, 1.15), speed: rand(0.9, 1.1), hue: rand(175, 205) };
  recordMorph('herb', g);
  const f = baseFish(x !== undefined ? x : rand(30, W - 30), y !== undefined ? y : rand(H * 0.25, H * 0.75), g);
  f.gen = gen || 1;
  herbs.push(f);
  return f;
}

/* ---------- 포식자 ---------- */
const PRED_MAX = 6;
const preds = [];
function spawnPred(x, y, genes, gen) {
  if (preds.length >= PRED_MAX) return null;
  const g = genes || { size: rand(1.0, 1.2), speed: rand(0.95, 1.1), hue: rand(345, 375) % 360 };
  recordMorph('pred', g);
  const f = baseFish(x !== undefined ? x : rand(40, W - 40), y !== undefined ? y : rand(H * 0.2, H * 0.6), g);
  f.gen = gen || 1;
  f.energy = 80;
  preds.push(f);
  return f;
}

/* ---------- 기포/입자 ---------- */
const bubbles = [];
function spawnBubble(x, y) {
  bubbles.push({ x, y, r: rand(1, 3.4), vy: rand(14, 34), drift: rand(0, TAU) });
}

/* ---------- 관찰 로그 ---------- */
const logEl = document.getElementById('log');
const logs = [];
function addLog(msg) {
  logs.push({ d: env.day, msg });
  if (logs.length > 30) logs.shift();
  logEl.innerHTML = logs.slice(-3).map(l => '· ' + (l.d > 0 ? l.d + '일째 · ' : '') + l.msg).join('<br>');
  if (dashOpen) renderDashLog();
}
let firstBreedLogged = false, firstDeathLogged = false, firstHuntLogged = false;

/* ---------- 초기 개체 ---------- */
/* ---------- 저장 · 오프라인 정산 (v0.6) ---------- */
const SAVE_VER = 6;
const SAVE_KEY = n => 'blueCycle.save.' + n;
const SLOT_KEY = 'blueCycle.slot';
const IS_SIM = new URLSearchParams(location.search).has('sim');
const activeSlot = () => { const n = parseInt(localStorage.getItem(SLOT_KEY) || '1', 10); return (n >= 1 && n <= 3) ? n : 1; };

function packFish(f) { return [Math.round(f.x), Math.round(f.y), Math.round(f.energy), Math.round(f.age), f.gen, +f.genes.size.toFixed(3), +f.genes.speed.toFixed(3), Math.round(f.genes.hue)]; }
function serialize() {
  return JSON.stringify({
    v: SAVE_VER, savedAt: Date.now(),
    env: { nutrients: env.nutrients, oxygen: env.oxygen, temp: env.temp, t: env.t },
    stats, logs: logs.slice(-30), codex: [...codex.entries()],
    algae: algae.map(a => [Math.round(a.x), Math.round(a.y), +a.r.toFixed(1), Math.round(a.e)]),
    herbs: herbs.map(packFish), preds: preds.map(packFish),
  });
}
function readSlot(n) {
  try {
    const raw = localStorage.getItem(SAVE_KEY(n));
    if (!raw) return null;
    const d = JSON.parse(raw);
    if (!d || d.v !== SAVE_VER || !d.env || !Array.isArray(d.herbs) || !Array.isArray(d.preds) || !Array.isArray(d.algae)) throw new Error('shape');
    return d;
  } catch {
    /* 손상 데이터는 격리하고 슬롯을 비움 — 절대 깨진 상태로 시작하지 않음 */
    try {
      const raw = localStorage.getItem(SAVE_KEY(n));
      if (raw) localStorage.setItem(SAVE_KEY(n) + '.corrupt', raw);
      localStorage.removeItem(SAVE_KEY(n));
    } catch {}
    return 'corrupt';
  }
}

let restoring = false;
function initWorld(d) {
  if (!d) {
    for (let i = 0; i < 130; i++) spawnAlgae();
    for (let i = 0; i < 26; i++) spawnHerb();
    for (let i = 0; i < 4; i++) spawnPred();
    return null;
  }
  restoring = true;
  env.nutrients = clamp(+d.env.nutrients || 0.6, 0, 1);
  env.oxygen = clamp(+d.env.oxygen || 0.6, 0, 1);
  env.temp = clamp(+d.env.temp || 22, 10, 35);
  env.t = Math.max(0, +d.env.t || 0);
  env.day = Math.floor(env.t / DAY_LEN);
  Object.assign(stats, d.stats || {});
  for (const l of (d.logs || []).slice(-30)) if (l && typeof l.msg === 'string') logs.push({ d: l.d | 0, msg: String(l.msg).slice(0, 90) });
  for (const kv of (d.codex || [])) if (Array.isArray(kv) && kv[1] && kv[1].name) codex.set(kv[0], kv[1]);
  for (const a of d.algae.slice(0, ALGAE_MAX)) {
    const [x, y, r, e] = a;
    if (!isFinite(x) || !isFinite(y)) continue;
    algae.push({ x: clamp(x, 4, W - 4), y: clamp(y, 4, H - 8), vx: rand(-4, 4), vy: rand(-2, 2), r: clamp(r || 2, 1, 5), e: clamp(e || 12, 4, 30), ph: rand(0, TAU) });
  }
  const unpack = (arr, kind) => {
    for (const p of arr) {
      if (!Array.isArray(p)) continue;
      const [x, y, e, age, gen, sz, sp, hue] = p;
      if (![x, y, sz, sp, hue].every(isFinite)) continue;
      const g = { size: clamp(sz, 0.75, 1.45), speed: clamp(sp, 0.75, 1.35), hue: ((hue % 360) + 360) % 360 };
      const f = kind === 'herb'
        ? spawnHerb(clamp(x, 12, W - 12), clamp(y, 14, H - 22), g, (gen | 0) || 1)
        : spawnPred(clamp(x, 16, W - 16), clamp(y, 16, H - 30), g, (gen | 0) || 1);
      if (f) { f.energy = clamp(e || 50, 1, 110); f.age = Math.max(0, age || 0); }
    }
  };
  unpack(d.herbs.slice(0, HERB_MAX), 'herb');
  unpack(d.preds.slice(0, PRED_MAX), 'pred');
  restoring = false;
  return { savedAt: d.savedAt };
}

/* 오프라인 정산: 떠나 있던 시간(최대 8시간)을 청크로 돌려 반영 — UI는 살아 있고 진행률 표시 */
const settleEl = document.getElementById('settle');
function startSettle(savedAt) {
  if (!isFinite(savedAt)) return;
  const elapsed = clamp((Date.now() - savedAt) / 1000, 0, 8 * 3600);
  if (elapsed < 120) return;
  const before = { day: env.day, h: herbs.length, p: preds.length, dex: codex.size };
  const steps = Math.floor(elapsed / 0.25);
  let done = 0;
  settleEl.innerHTML = '<h3>자리를 비운 사이</h3>수족관의 시간을 따라잡는 중… <b id="settlePct">0%</b>';
  settleEl.classList.add('show');
  const pctEl = () => document.getElementById('settlePct');
  const CHUNK = 6000;
  (function run() {
    const end = Math.min(done + CHUNK, steps);
    for (; done < end; done++) step(0.25);
    if (done < steps) {
      if (pctEl()) pctEl().textContent = Math.round(done / steps * 100) + '%';
      setTimeout(run, 0);
      return;
    }
    const after = { day: env.day, h: herbs.length, p: preds.length, dex: codex.size };
    addLog('돌아오니 ' + (after.day - before.day) + '일이 지나 있었다');
    const hh = Math.floor(elapsed / 3600), mm = Math.floor((elapsed % 3600) / 60);
    settleEl.innerHTML = `<h3>자리를 비운 사이</h3>` +
      `${hh > 0 ? hh + '시간 ' : ''}${mm}분 동안 수족관은 계속 살아 있었습니다 (최대 8시간 정산)<br>` +
      `경과 <b>${before.day}일 → ${after.day}일</b> · ` +
      `초식어 <b>${before.h} → ${after.h}</b> · ` +
      `포식자 <b>${before.p} → ${after.p}</b> · ` +
      `도감 <b>${before.dex} → ${after.dex}종</b>` +
      `<button id="settleOk">확인</button>`;
    document.getElementById('settleOk').addEventListener('click', () => settleEl.classList.remove('show'));
  })();
}

/* 부팅: 활성 슬롯을 읽어 복원, 손상 시 안전하게 새 수족관 */
if (!IS_SIM) {

  } else if (d) {
    const info = initWorld(d);
    if (info) startSettle(info.savedAt);

  }
} else {

}

/* 터치: 개체에 가까우면 검사 카드, 빈 물이면 먹이 */
let selFish = null;
const inspectEl = document.getElementById('inspect');
function hideInspect() { selFish = null; inspectEl.classList.remove('show'); }
function renderInspect() {
  if (!selFish) return;
  if (!herbs.includes(selFish) && !preds.includes(selFish)) { hideInspect(); return; }
  const f = selFish, g = f.genes;
  const kind = herbs.includes(f) ? 'herb' : 'pred';
  const m = morphOf(kind, g);
  inspectEl.innerHTML =
    `<div class="ih"><span class="idot" style="background:hsl(${g.hue},65%,60%)"></span>` +
    `<span class="inm">${m.name}</span><span class="rr c${m.rarity}">${RARITY[m.rarity]}</span>` +

    `<span>에너지 <b>${Math.round(f.energy)}</b></span><span>크기 <b>×${g.size.toFixed(2)}</b></span>` +
    `<span>속도 <b>×${g.speed.toFixed(2)}</b></span><span>색상 <b>${Math.round(g.hue)}°</b></span></div>`;
  inspectEl.classList.add('show');

canvas.addEventListener('pointerdown', e => {
  const r = canvas.getBoundingClientRect();
  const tx = e.clientX - r.left, ty = e.clientY - r.top;
  let best = null, bd = 1e9;
  for (const f of herbs) { const dx = f.x - tx, dy = f.y - ty, d2 = dx * dx + dy * dy; if (d2 < bd) { bd = d2; best = f; } }
  for (const f of preds) { const dx = f.x - tx, dy = f.y - ty, d2 = dx * dx + dy * dy; if (d2 < bd) { bd = d2; best = f; } }
  if (best && bd < 44 * 44) { selFish = best; renderInspect(); return; }
  hideInspect();
  for (let i = 0; i < 10; i++) spawnAlgae(e.clientX + rand(-30, 30), e.clientY + rand(-20, 20), true);
});

const btnPause = document.getElementById('btnPause');
const btnSpeed = document.getElementById('btnSpeed');

/* ============================================================
   시뮬레이션 스텝
   ============================================================ */
function step(dt) {
  env.t += dt;
  env.day = Math.floor(env.t / DAY_LEN);

  /* --- 환경: 낮밤 · 수온 · 용존 산소 (v0.4) --- */
  env.light = daylight(env.t);
  const seasonDrift = Math.sin(env.t / 240) * 1.5;                 // 아주 느린 계절 변동
  const tempTarget = 17.5 + env.light * 8 + (env.bloom > 0 ? 2 : 0) + seasonDrift;
  env.temp += (tempTarget - env.temp) * clamp(dt * 0.03, 0, 1);
  /* 산소: 낮에 조류·수초 광합성으로 생산, 물고기 호흡으로 소비, 대기 평형으로 확산 */
  const oProd = env.light * (algae.length / ALGAE_MAX) * 0.05 + env.light * plants.length * 0.0016;
  const oCons = (herbs.length * 0.0004 + preds.length * 0.0018) * (1 + (env.temp - 22) * 0.03);
  env.oxygen = clamp(env.oxygen + dt * (oProd - oCons + (0.62 - env.oxygen) * 0.03), 0, 1);
  if (env.oxygen < 0.24 && !env.oxyWarned) { env.oxyWarned = true; addLog('용존 산소가 낮아지고 있다'); }
  if (env.oxygen > 0.38) env.oxyWarned = false;

  /* --- 수초: 영양염 소모해 성장, 낮에만 포자(조류) 방출 --- */
  for (const p of plants) {
    p.grow = clamp(p.grow + dt * 0.02 * env.nutrients * (0.3 + env.light * 0.7), 0.3, 1);
    p.spore -= dt;
    if (p.spore <= 0) {
      p.spore = rand(2.5, 6) / (0.25 + env.nutrients * (0.15 + env.light * 0.85));
      if (env.light > 0.2 || Math.random() < 0.2) spawnAlgae(p.x + rand(-14, 14), H - p.h * p.grow - rand(0, 30));
    }
  }
  /* 영양염은 서서히 소모 */
  env.nutrients = clamp(env.nutrients - dt * 0.004, 0, 1);
  /* 부유 조류 자연 발생 — 낮 광합성에 비례, 밤에는 잔량만 */
  if (algae.length < ALGAE_MAX && Math.random() < dt * (0.3 + env.light * 3.2) * (0.35 + env.nutrients)) spawnAlgae();

  /* --- 조류 대발생 이벤트 (영양염 풍부 + 한낮) --- */
  if (env.bloomCd > 0) env.bloomCd -= dt;
  if (env.bloom > 0) {
    env.bloom -= dt;
    for (let k = 0; k < 2; k++) if (algae.length < ALGAE_MAX && Math.random() < dt * 9) spawnAlgae(rand(10, W - 10), rand(10, H * 0.7));
    if (env.bloom <= 0) {
      env.bloomCd = 75;
      /* 대발생 종료: 일부 조류가 죽어 영양염으로 — 산소 급감 유발 */
      const die = Math.floor(algae.length * 0.35);
      for (let k = 0; k < die; k++) { const a = algae.splice((Math.random() * algae.length) | 0, 1)[0]; if (a) dropDetritus(a.x, a.y, 0.8); }
      env.oxygen = clamp(env.oxygen - 0.12, 0, 1);
      addLog('조류 대발생이 가라앉았다');
    }
  } else if (env.bloomCd <= 0 && env.nutrients > 0.5 && env.light > 0.7 && algae.length > 60 && Math.random() < dt * 0.012) {
    env.bloom = 13;
    addLog('조류가 대발생하기 시작했다');
  }

  /* --- 조류 이동 --- */
  algaeGrid.clear();
  for (let i = algae.length - 1; i >= 0; i--) {
    const a = algae[i];
    a.ph += dt;
    a.x += (a.vx + Math.sin(a.ph * 0.8) * 6) * dt;
    a.y += (a.vy + Math.cos(a.ph * 0.6) * 4) * dt;
    if (a.x < 4) a.x = 4, a.vx = Math.abs(a.vx);
    if (a.x > W - 4) a.x = W - 4, a.vx = -Math.abs(a.vx);
    if (a.y < 4) a.y = 4, a.vy = Math.abs(a.vy);
    if (a.y > H - 8) a.y = H - 8, a.vy = -Math.abs(a.vy);
    algaeGrid.add(a);
  }

  /* --- 찌꺼기: 가라앉아 영양염으로 --- */
  for (let i = detritus.length - 1; i >= 0; i--) {
    const d = detritus[i];
    d.y += d.vy * dt;
    if (d.y > H - 6) {
      env.nutrients = clamp(env.nutrients + d.amt * 0.004, 0, 1);
      detritus.splice(i, 1);
    }
  }

  /* --- 초식어 --- */
  herbGrid.clear();
  for (const h of herbs) herbGrid.add(h);
  for (let i = herbs.length - 1; i >= 0; i--) {
    const f = herbs[i];
    f.age += dt;
    const g = f.genes;
    const spd = 42 * g.speed;
    const hungry = f.energy < 68;

    // 포식자 회피
    let fleeX = 0, fleeY = 0, danger = false;
    for (const p of preds) {
      const dx = f.x - p.x, dy = f.y - p.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < 120 * 120) { danger = true; const d = Math.sqrt(d2) || 1; fleeX += dx / d; fleeY += dy / d; }
    }

    let ax = 0, ay = 0;
    if (danger) {
      ax = fleeX * spd * 2.6; ay = fleeY * spd * 2.6;
    } else if (hungry) {
      // 가장 가까운 조류 탐색
      let best = null, bd = 1e9;
      algaeGrid.near(f.x, f.y, 130, _near);
      for (const a of _near) {
        const dx = a.x - f.x, dy = a.y - f.y, d2 = dx * dx + dy * dy;
        if (d2 < bd) { bd = d2; best = a; }
      }
      if (best) {
        const d = Math.sqrt(bd) || 1;
        ax = (best.x - f.x) / d * spd; ay = (best.y - f.y) / d * spd;
        if (d < 9 * g.size + best.r) {
          f.energy = clamp(f.energy + best.e, 0, 100);
          const ai = algae.indexOf(best);
          if (ai >= 0) algae.splice(ai, 1);
          if (Math.random() < 0.3) spawnBubble(f.x, f.y);
        }
      } else {
        ax = Math.cos(f.wobble) * spd * 0.5; ay = Math.sin(f.wobble * 0.7) * spd * 0.35;
      }
    } else {
      // 느긋한 유영 + 약한 군집
      ax = Math.cos(f.wobble) * spd * 0.4; ay = Math.sin(f.wobble * 0.8) * spd * 0.3;
      herbGrid.near(f.x, f.y, 56, _near);
      let cx = 0, cy = 0, n = 0;
      for (const o of _near) { if (o !== f) { cx += o.vx; cy += o.vy; n++; } }
      if (n > 0) { ax += (cx / n) * 0.35; ay += (cy / n) * 0.35; }
    }
    f.wobble += dt * rand(0.4, 1.1);

    f.vx += (ax - f.vx) * clamp(dt * 2.4, 0, 1);
    f.vy += (ay - f.vy) * clamp(dt * 2.4, 0, 1);
    f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.x < 12) f.x = 12, f.vx = Math.abs(f.vx);
    if (f.x > W - 12) f.x = W - 12, f.vx = -Math.abs(f.vx);
    if (f.y < 14) f.y = 14, f.vy = Math.abs(f.vy);
    if (f.y > H - 22) f.y = H - 22, f.vy = -Math.abs(f.vy);

    f.energy -= dt * (1.85 + g.speed * 0.75) * (1 + (env.temp - 22) * 0.04) / (0.65 + env.oxygen * 0.55);
    f.dir = f.vx >= 0 ? 1 : -1;

    // 번식
    if (f.energy > 76 && f.age > 12 && herbs.length < 42) {
      f.energy *= 0.55;
      const ng = mutate(g, 1);
      const child = spawnHerb(f.x + rand(-8, 8), f.y + rand(-8, 8), ng, f.gen + 1);
      if (child) {
        stats.births++;
        if (f.gen + 1 > stats.maxGenHerb) { stats.maxGenHerb = f.gen + 1; if (stats.maxGenHerb >= 3) addLog('초식어 ' + stats.maxGenHerb + '세대 등장'); }
        if (Math.abs(ng.hue - g.hue) > 10) { stats.mutations++; if (stats.mutations <= 3 || stats.mutations % 10 === 0) addLog('새로운 색의 변이 출현 (누적 ' + stats.mutations + ')'); }
      }
      if (child && !firstBreedLogged) { firstBreedLogged = true; addLog('초식어 2세대가 태어났다'); }
    }
    // 죽음
    if (f.energy <= 0 || f.age > 150) {
      dropDetritus(f.x, f.y, 3.2);
      stats.deaths++;
      herbs.splice(i, 1);
      if (!firstDeathLogged) { firstDeathLogged = true; addLog('죽은 개체가 영양염으로 돌아갔다'); }
    }
  }

  /* --- 포식자 --- */
  for (let i = preds.length - 1; i >= 0; i--) {
    const f = preds[i];
    f.age += dt;
    const g = f.genes;
    const spd = 52 * g.speed;
    let ax, ay;
    let best = null, bd = 1e9;
    const huntDrive = herbs.length < 8 ? 45 : 88; // 먹이가 귀하면 사냥을 자제 — 회복 기회
    if (f.energy < huntDrive) {
      herbGrid.near(f.x, f.y, 240, _near);
      for (const h of _near) {
        const dx = h.x - f.x, dy = h.y - f.y, d2 = dx * dx + dy * dy;
        if (d2 < bd) { bd = d2; best = h; }
      }
    }
    if (best) {
      const d = Math.sqrt(bd) || 1;
      ax = (best.x - f.x) / d * spd * 1.5; ay = (best.y - f.y) / d * spd * 1.5;
      if (d < 13 * g.size + 6 * best.genes.size) {
        f.energy = clamp(f.energy + 32, 0, 110);
        const hi = herbs.indexOf(best);
        if (hi >= 0) { herbs.splice(hi, 1); dropDetritus(f.x, f.y, 1.2); stats.hunts++; stats.deaths++; }
        if (!firstHuntLogged) { firstHuntLogged = true; addLog('포식자가 사냥에 성공했다'); }
        for (let b = 0; b < 3; b++) spawnBubble(f.x + rand(-6, 6), f.y + rand(-6, 6));
      }
    } else {
      ax = Math.cos(f.wobble) * spd * 0.5; ay = Math.sin(f.wobble * 0.6) * spd * 0.4;
    }
    f.wobble += dt * rand(0.3, 0.8);
    f.vx += (ax - f.vx) * clamp(dt * 1.8, 0, 1);
    f.vy += (ay - f.vy) * clamp(dt * 1.8, 0, 1);
    f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.x < 16) f.x = 16, f.vx = Math.abs(f.vx);
    if (f.x > W - 16) f.x = W - 16, f.vx = -Math.abs(f.vx);
    if (f.y < 16) f.y = 16, f.vy = Math.abs(f.vy);
    if (f.y > H - 30) f.y = H - 30, f.vy = -Math.abs(f.vy);
    f.energy -= dt * (1.8 + g.speed * 0.6) * (1 + (env.temp - 22) * 0.04) / (0.65 + env.oxygen * 0.55);
    f.dir = f.vx >= 0 ? 1 : -1;

    if (f.energy > 98 && f.age > 30 && preds.length < PRED_MAX) {
      f.energy *= 0.55;
      const ng = mutate(g, 1);
      const child = spawnPred(f.x + rand(-10, 10), f.y + rand(-10, 10), ng, f.gen + 1);
      if (child) {
        stats.births++;
        if (f.gen + 1 > stats.maxGenPred) { stats.maxGenPred = f.gen + 1; addLog('포식자 ' + stats.maxGenPred + '세대 등장'); }
        if (Math.abs(ng.hue - g.hue) > 10) stats.mutations++;
      }
    }
    if (f.energy <= 0 || f.age > 220) {
      dropDetritus(f.x, f.y, 6);
      stats.deaths++;
      preds.splice(i, 1);
    }
  }

  /* --- 기포 --- */
  if (Math.random() < dt * 2.5) spawnBubble(rand(0, W), H - 10);
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.y -= b.vy * dt;
    b.x += Math.sin(b.drift + b.y * 0.02) * 8 * dt;
    if (b.y < -6) bubbles.splice(i, 1);
  }

  /* --- 이력 샘플링 --- */
  histAcc += dt;
  if (histAcc >= 0.5) {
    histAcc = 0;
    hist.a.push(algae.length); hist.h.push(herbs.length); hist.p.push(preds.length);
    hist.o.push(Math.round(env.oxygen * 100)); hist.tp.push(Math.round(env.temp * 10) / 10);
    if (hist.a.length > HIST_MAX) { hist.a.shift(); hist.h.shift(); hist.p.shift(); hist.o.shift(); hist.tp.shift(); }
  }

  /* --- 멸종과 회복 이벤트 (v0.4) --- */
  if (herbs.length === 0) {
    if (!env.herbGone) { env.herbGone = true; env.herbRescue = 18; addLog('초식어가 모두 사라졌다'); }
    /* 포식 압력이 낮아질 때까지 기다렸다가 유입 — 유입 개체가 곧바로 먹히는 악순환 방지 */
    if (env.herbRescue > 0 && algae.length > 60) {
      if (preds.length <= 4) {
        env.herbRescue -= dt;
        if (env.herbRescue <= 0) {
          spawnHerb(); spawnHerb(); spawnHerb();
          env.herbGone = false;
          addLog('어디선가 초식어 무리가 흘러들었다');
        }
      }
    }
  } else env.herbGone = false;
  if (preds.length === 0) {
    if (!env.predGone) { env.predGone = true; addLog('포식자가 모두 사라졌다'); }
    if (env.predRescue < 0 && herbs.length > 12) env.predRescue = 20;
    if (env.predRescue >= 0) {
      env.predRescue -= dt;
      if (env.predRescue < 0) { spawnPred(); env.predGone = false; addLog('어디선가 포식자가 흘러들었다'); }
    }
  } else { env.predGone = false; env.predRescue = -1; }
}

/* ============================================================
   렌더링 (v0.2 — 척추 곡선 물고기, 수면, 빛줄기, 깊이색)
   ============================================================ */
/* 수면 반짝임 입자 */
const glints = [];
for (let i = 0; i < 14; i++) glints.push({ x: Math.random(), y: rand(4, 22), w: rand(14, 46), ph: rand(0, TAU), sp: rand(0.008, 0.03) });
/* 플랑크톤 입자 */
const motes = [];
for (let i = 0; i < 70; i++) motes.push({ x: Math.random(), y: Math.random(), r: rand(0.5, 1.6), ph: rand(0, TAU), sp: rand(0.5, 2) });

function drawBackground(t) {
  const grd = ctx.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, '#0d3a5e');
  grd.addColorStop(0.4, '#0a2f4d');
  grd.addColorStop(0.75, '#072037');
  grd.addColorStop(1, '#020e18');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  /* 빛줄기 — 깜빡임과 표류 */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 5; i++) {
    const drift = Math.sin(t * 0.07 + i * 1.7) * 60 + Math.sin(t * 0.023 + i * 3.1) * 30;
    const bx = W * (0.08 + i * 0.21) + drift;
    const flick = (0.6 + 0.4 * Math.sin(t * 0.5 + i * 2.2)) * (0.12 + env.light * 0.88);
    const g2 = ctx.createLinearGradient(bx, 0, bx + 100, H * 0.9);
    g2.addColorStop(0, `rgba(150,215,255,${0.10 * flick})`);
    g2.addColorStop(0.6, `rgba(140,205,250,${0.035 * flick})`);
    g2.addColorStop(1, 'rgba(140,205,250,0)');
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.moveTo(bx - 22, 0); ctx.lineTo(bx + 22, 0);
    ctx.lineTo(bx + 150, H * 0.9); ctx.lineTo(bx - 20, H * 0.9);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  /* 플랑크톤 */
  for (const m of motes) {
    const my = ((m.y * H + t * m.sp * 3) % H);
    const tw = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(t * 1.3 + m.ph));
    const depth = my / H;
    ctx.fillStyle = `rgba(170,215,240,${tw * (1 - depth * 0.55)})`;
    ctx.beginPath();
    ctx.arc((m.x * W + Math.sin(t * 0.3 + m.ph) * 12), my, m.r, 0, TAU);
    ctx.fill();
  }

  /* 바닥 */
  const sand = ctx.createLinearGradient(0, H - 60, 0, H);
  sand.addColorStop(0, '#27425a'); sand.addColorStop(0.5, '#1a2c3d'); sand.addColorStop(1, '#101c28');
  ctx.fillStyle = sand;
  ctx.beginPath();
  ctx.moveTo(0, H - 30);
  for (let x = 0; x <= W; x += 40) ctx.lineTo(x, H - 30 + Math.sin(x * 0.015 + 2) * 7);
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();

  /* 바닥 코스틱스 (빛 얼룩) */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 6; i++) {
    const cx = (i * 0.19 + 0.06) * W + Math.sin(t * 0.35 + i * 2.4) * 26;
    const cy = H - 18 - Math.abs(Math.sin(t * 0.28 + i)) * 14;
    const rr = 26 + Math.sin(t * 0.5 + i * 1.3) * 9;
    const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, rr);
    cg.addColorStop(0, 'rgba(120,200,240,0.10)');
    cg.addColorStop(1, 'rgba(120,200,240,0)');
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(cx, cy, rr, 0, TAU); ctx.fill();
  }
  ctx.restore();

  /* 수면 — 파도 밴드 + 반짝임 */
  const surf = ctx.createLinearGradient(0, 0, 0, 34);
  surf.addColorStop(0, 'rgba(140,215,250,0.28)');
  surf.addColorStop(1, 'rgba(140,215,250,0)');
  ctx.fillStyle = surf;
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(W, 0); ctx.lineTo(W, 10);
  for (let x = W; x >= 0; x -= 24) ctx.lineTo(x, 10 + Math.sin(x * 0.03 + t * 1.4) * 3.5 + Math.sin(x * 0.011 - t * 0.7) * 3);
  ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const gl of glints) {
    const gx = ((gl.x + t * gl.sp) % 1) * W;
    const a = 0.10 + 0.16 * (0.5 + 0.5 * Math.sin(t * 2 + gl.ph));
    ctx.fillStyle = `rgba(200,235,255,${a})`;
    ctx.beginPath();
    ctx.ellipse(gx, gl.y, gl.w * 0.5, 1.4, 0, 0, TAU);
    ctx.fill();
  }
  ctx.restore();

  /* 비네트 */
  const vg = ctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.45, W / 2, H * 0.55, Math.max(W, H) * 0.95);
  vg.addColorStop(0, 'rgba(0,10,20,0)');
  vg.addColorStop(1, 'rgba(0,8,16,0.42)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

function drawPlants(t) {
  for (const p of plants) {
    const hMax = p.h * p.grow;
    const depth = 0.85;
    for (let b = 0; b < p.blades; b++) {
      const off = (b - p.blades / 2) * 5;
      const sway = Math.sin(t * 0.9 + p.ph + b * 0.7) * (6 + b);
      const bh = hMax * (0.6 + 0.4 * ((b * 37 % 10) / 10));
      const g = ctx.createLinearGradient(p.x, H, p.x, H - bh);
      g.addColorStop(0, `rgba(24,80,54,${depth})`);
      g.addColorStop(0.7, `rgba(58,160,96,${depth})`);
      g.addColorStop(1, `rgba(110,220,140,${depth * 0.92})`);
      ctx.strokeStyle = g;
      ctx.lineWidth = 2.6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p.x + off * 0.4, H - 24);
      ctx.quadraticCurveTo(p.x + off + sway * 0.4, H - 24 - bh * 0.6, p.x + off + sway, H - 24 - bh);
      ctx.stroke();
      /* 잎 끝 물방울 반사 */
      if (b % 3 === 0) {
        ctx.fillStyle = 'rgba(170,240,190,0.35)';
        ctx.beginPath(); ctx.arc(p.x + off + sway, H - 24 - bh, 1.3, 0, TAU); ctx.fill();
      }
    }
  }
}

function drawAlgae(t) {
  for (const a of algae) {
    const depth = clamp(a.y / H, 0, 1);
    const pulse = 1 + Math.sin(t * 2 + a.ph) * 0.12;
    ctx.fillStyle = `rgba(${105 - depth * 30 | 0},${214 - depth * 50 | 0},${124 - depth * 20 | 0},${0.88 - depth * 0.18})`;
    ctx.beginPath();
    ctx.arc(a.x, a.y, a.r * pulse, 0, TAU);
    ctx.fill();
    ctx.fillStyle = `rgba(190,255,200,${0.5 - depth * 0.25})`;
    ctx.beginPath();
    ctx.arc(a.x - a.r * 0.25, a.y - a.r * 0.3, a.r * 0.42 * pulse, 0, TAU);
    ctx.fill();
  }
}

function drawDetritus() {
  ctx.fillStyle = 'rgba(160,140,110,0.5)';
  for (const d of detritus) {
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.fill();
  }
}

/* ---------- 척추 곡선 물고기 ---------- */
const SPINE_N = 7;
const BODY_PROF = [0.40, 0.50, 0.46, 0.36, 0.26, 0.16, 0.08]; // 머리→꼬리 반경 비율
function drawFish(f, t, kind) {
  const g = f.genes;
  const s = (kind === 'pred' ? 15 : 9.5) * g.size;
  const spd = Math.hypot(f.vx, f.vy);
  const sf = clamp(spd / 55, 0.25, 1.8);

  /* 진행 방향 (스무딩) */
  if (spd > 4) {
    const target = Math.atan2(f.vy, f.vx);
    let d = target - (f.heading || 0);
    while (d > Math.PI) d -= TAU;
    while (d < -Math.PI) d += TAU;
    f.heading = (f.heading || 0) + d * 0.12;
  }
  const ang = f.heading || 0;
  const ca = Math.cos(ang), sa = Math.sin(ang);
  const px = -sa, py = ca; // 수직 방향

  /* 척추 포인트: 머리에서 꼬리로 진행파 */
  const freq = (kind === 'pred' ? 6.5 : 8.5) * (0.6 + 0.5 * sf);
  const amp = s * 0.30 * (0.5 + 0.7 * sf);
  const pts = [];
  for (let i = 0; i < SPINE_N; i++) {
    const dd = i / (SPINE_N - 1);
    const along = s * 2.0 * dd;
    const wob = Math.sin(t * freq + f.ph - i * 1.05) * amp * dd;
    pts.push([f.x - ca * along + px * wob, f.y - sa * along + py * wob]);
  }

  /* 깊이 색: 깊을수록 어둡고 푸르게 */
  const depth = clamp(f.y / H, 0, 1);
  const hue = g.hue + depth * 12;
  const sat = (kind === 'pred' ? 62 : 55) - depth * 16;
  const li = ((kind === 'pred' ? 62 : 68) - depth * 22);

  /* 몸통 — 척추를 따라 좁아지는 원들 */
  for (let i = SPINE_N - 1; i >= 0; i--) {
    const r = s * BODY_PROF[i];
    if (r < 0.6) continue;
    const shade = li + (i === 0 ? 6 : 0) - i * 1.5;
    ctx.fillStyle = `hsla(${hue},${sat}%,${shade}%,0.97)`;
    ctx.beginPath();
    ctx.arc(pts[i][0], pts[i][1], r, 0, TAU);
    ctx.fill();
  }
  /* 배꼽 밝은면 — 아래쪽으로 살짝 치우친 작은 원들 */
  for (let i = SPINE_N - 3; i >= 0; i--) {
    const r = s * BODY_PROF[i] * 0.62;
    if (r < 0.5) continue;
    ctx.fillStyle = `hsla(${hue},${Math.max(sat - 14, 8)}%,${li + 15}%,0.5)`;
    ctx.beginPath();
    ctx.arc(pts[i][0] + px * r * 0.45, pts[i][1] + py * r * 0.45, r, 0, TAU);
    ctx.fill();
  }
  /* 등지느러미 */
  const d1 = pts[1], d2 = pts[3];
  ctx.fillStyle = `hsla(${hue},${sat}%,${li - 14}%,0.85)`;
  ctx.beginPath();
  ctx.moveTo(d1[0], d1[1]);
  ctx.quadraticCurveTo(
    (d1[0] + d2[0]) / 2 - px * s * 0.72, (d1[1] + d2[1]) / 2 - py * s * 0.72,
    d2[0] - px * s * 0.1, d2[1] - py * s * 0.1);
  ctx.closePath(); ctx.fill();
  /* 꼬리지느러미 — 척추 끝에서 더 크게 흔들림 */
  const tail = pts[SPINE_N - 1], pre = pts[SPINE_N - 2];
  const ta = Math.atan2(tail[1] - pre[1], tail[0] - pre[0]);
  const twag = Math.sin(t * freq + f.ph - SPINE_N * 1.05) * 0.7;
  const tca = Math.cos(ta), tsa = Math.sin(ta);
  const tpx = -tsa, tpy = tca;
  const tl = s * 0.85, twd = s * 0.42;
  ctx.fillStyle = `hsla(${hue},${sat}%,${li - 10}%,0.9)`;
  ctx.beginPath();
  ctx.moveTo(tail[0], tail[1]);
  ctx.quadraticCurveTo(
    tail[0] - tca * tl * 0.6 + tpx * twd * (1 + twag), tail[1] - tsa * tl * 0.6 + tpy * twd * (1 + twag),
    tail[0] - tca * tl + tpx * twd * 0.4 * (1 + twag * 1.4), tail[1] - tsa * tl + tpy * twd * 0.4 * (1 + twag * 1.4));
  ctx.quadraticCurveTo(
    tail[0] - tca * tl * 0.72, tail[1] - tsa * tl * 0.72,
    tail[0] - tca * tl - tpx * twd * 0.4 * (1 - twag * 1.4), tail[1] - tsa * tl - tpy * twd * 0.4 * (1 - twag * 1.4));
  ctx.quadraticCurveTo(
    tail[0] - tca * tl * 0.6 - tpx * twd * (1 - twag), tail[1] - tsa * tl * 0.6 - tpy * twd * (1 - twag),
    tail[0], tail[1]);
  ctx.fill();
  /* 가슴지느러미 */
  const hp = pts[1];
  const finA = Math.sin(t * freq * 1.4 + f.ph) * 0.5;
  ctx.fillStyle = `hsla(${hue},${sat}%,${li - 6}%,0.75)`;
  ctx.beginPath();
  ctx.moveTo(hp[0] + px * s * 0.2, hp[1] + py * s * 0.2);
  ctx.quadraticCurveTo(
    hp[0] + px * s * (0.75 + finA * 0.2) - ca * s * 0.25, hp[1] + py * s * (0.75 + finA * 0.2) - sa * s * 0.25,
    hp[0] + px * s * 0.28 - ca * s * 0.42, hp[1] + py * s * 0.28 - sa * s * 0.42);
  ctx.closePath(); ctx.fill();
  /* 눈 */
  const ex = pts[0][0] + ca * s * 0.30 + px * s * 0.14;
  const ey = pts[0][1] + sa * s * 0.30 + py * s * 0.14;
  ctx.fillStyle = 'rgba(8,18,28,0.92)';
  ctx.beginPath(); ctx.arc(ex, ey, s * 0.095, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.arc(ex + s * 0.03, ey - s * 0.03, s * 0.034, 0, TAU); ctx.fill();
  /* 아가미 */
  ctx.strokeStyle = `hsla(${hue},${sat}%,${li - 24}%,0.45)`;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(pts[0][0] - ca * s * 0.05, pts[0][1] - sa * s * 0.05, s * 0.26, ang + 1.9, ang + 4.4);
  ctx.stroke();
}

function drawBubbles() {
  ctx.strokeStyle = 'rgba(180,225,250,0.4)';
  ctx.lineWidth = 1;
  for (const b of bubbles) {
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.stroke();
    ctx.fillStyle = 'rgba(220,240,255,0.25)';
    ctx.beginPath(); ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.3, 0, TAU); ctx.fill();
  }
}

/* ============================================================
   대시보드 (v0.3)

const dashEl = document.getElementById('dash');
const btnDash = document.getElementById('btnDash');
let dashOpen = false;
btnDash.addEventListener('click', () => {

const SERIES = [
  { key: 'a', name: '조류', color: '#69d67c' },
  { key: 'h', name: '초식어', color: '#8fd3e8' },
  { key: 'p', name: '포식자', color: '#f0918a' },
];
function fitCanvas(cv, hCss) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = cv.clientWidth || (window.innerWidth - 32);
  /* 크기가 같으면 백링 스토어 재할당을 건너뛰고 지우기만 (소프트웨어 렌더링 비용 절감) */
  if (cv.width !== w * dpr || cv.height !== hCss * dpr) {
    cv.width = w * dpr; cv.height = hCss * dpr;
    cv.style.height = hCss + 'px';
  }
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, w, hCss);
  return [c, w, hCss];
}

function drawLineChart() {
  const cv = document.getElementById('chLine');
  const [c, w, h] = fitCanvas(cv, 132);
  const padL = 30, padB = 16, padT = 8, padR = 8;
  const n = hist.a.length;
  let maxV = 10;
  for (const s of SERIES) for (const v of hist[s.key]) if (v > maxV) maxV = v;
  maxV = Math.ceil(maxV * 1.15 / 10) * 10;
  /* 격자 */
  c.strokeStyle = 'rgba(120,190,230,0.12)'; c.lineWidth = 1;
  c.fillStyle = 'rgba(140,190,215,0.6)'; c.font = '10px sans-serif'; c.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const y = padT + (h - padT - padB) * i / 4;
    c.beginPath(); c.moveTo(padL, y); c.lineTo(w - padR, y); c.stroke();
    c.fillText(Math.round(maxV * (4 - i) / 4), padL - 5, y + 3);
  }
  const x0 = padL, x1 = w - padR;
  for (const s of SERIES) {
    const arr = hist[s.key];
    if (arr.length < 2) continue;
    const stride = Math.max(1, Math.ceil(arr.length / 150));
    c.strokeStyle = s.color; c.lineWidth = 1.8; c.lineJoin = 'round';
    c.beginPath();
    for (let i = 0; i < arr.length; i += stride) {
      const px = x0 + (x1 - x0) * (i / (HIST_MAX - 1));
      const y = padT + (h - padT - padB) * (1 - arr[i] / maxV);
      if (i === 0) c.moveTo(px, y); else c.lineTo(px, y);
    }
    c.stroke();
    /* 현재값 점 */
    const lx = x0 + (x1 - x0) * ((arr.length - 1) / (HIST_MAX - 1));
    const ly = padT + (h - padT - padB) * (1 - arr[arr.length - 1] / maxV);
    c.fillStyle = s.color;
    c.beginPath(); c.arc(lx, ly, 3, 0, TAU); c.fill();
  }
  document.getElementById('lineLeg').innerHTML = SERIES.map(s =>
    `<span><span class="dot" style="background:${s.color}"></span>${s.name} ${hist[s.key].length ? hist[s.key][hist[s.key].length - 1] : 0}</span>`).join('');
}

function biomass() {
  let a = 0, h = 0, p = 0;
  for (const x of algae) a += x.e * 0.25;
  for (const f of herbs) h += 9 * f.genes.size ** 3;
  for (const f of preds) p += 42 * f.genes.size ** 3;
  return [
    { name: '조류', v: a, color: '#69d67c' },
    { name: '초식어', v: h, color: '#8fd3e8' },
    { name: '포식자', v: p, color: '#f0918a' },
  ];
}
function drawPie() {
  const cv = document.getElementById('chPie');
  const [c, w, h] = fitCanvas(cv, 150);
  const data = biomass();
  const total = data.reduce((s, d) => s + d.v, 0) || 1;
  const cx = w / 2, cy = h / 2, r = Math.min(w, h) / 2 - 14, rw = 20;
  let a0 = -Math.PI / 2;
  for (const d of data) {
    const a1 = a0 + (d.v / total) * TAU;
    c.strokeStyle = d.color; c.lineWidth = rw;
    c.beginPath();
    c.arc(cx, cy, r - rw / 2, a0 + 0.02, a1 - 0.02);
    c.stroke();
    a0 = a1;
  }
  c.fillStyle = 'rgba(234,246,255,0.92)'; c.font = '700 15px sans-serif'; c.textAlign = 'center';
  c.fillText(Math.round(total), cx, cy + 1);
  c.fillStyle = 'rgba(140,190,215,0.7)'; c.font = '10px sans-serif';
  c.fillText('총 생물량', cx, cy + 15);
  document.getElementById('pieLeg').innerHTML = data.map(d =>
    `<span><span class="dot" style="background:${d.color}"></span>${d.name} ${(d.v / total * 100).toFixed(1)}%</span>`).join('');
}

function drawGenStats() {
  const items = [
    ['초식어 최고 세대', stats.maxGenHerb + '세대'],
    ['포식자 최고 세대', stats.maxGenPred + '세대'],
    ['누적 탄생', stats.births],
    ['누적 죽음', stats.deaths],
    ['사냥 성공', stats.hunts],
    ['변이 출현', stats.mutations],
    ['도감 발견', codex.size + '종'],
  ];
  document.getElementById('genStats').innerHTML = items.map(([k, v]) =>
    `<div class="row"><span>${k}</span><b>${v}</b></div>`).join('');
}

function drawDex() {
  const arr = [...codex.values()].sort((a, b) => b.rarity - a.rarity || a.firstDay - b.firstDay);
  document.getElementById('dexCount').textContent = arr.length + '종';
  document.getElementById('dexGrid').innerHTML = arr.map(m =>
    `<div class="m"><span class="dot" style="background:hsl(${m.hue},65%,55%)"></span>` +
    `<span><span class="nm">${m.name}</span><br>${m.firstDay}일 발견 · ${m.seen}마리</span>` +
    `<span class="rr c${m.rarity}">${RARITY[m.rarity]}</span></div>`).join('');
}
function renderDashLog() {
  document.getElementById('dashLog').innerHTML = logs.slice().reverse().map(l =>
    `<div><span class="d">${l.d}일</span>${l.msg}</div>`).join('');
}

const ENV_SERIES = [
  { key: 'o', name: '산소 %', color: '#7fd4ff' },
  { key: 'tp', name: '수온 °C', color: '#ffb27d' },
];
function drawEnvStats() {
  const items = [
    ['시간대', phaseLabel()],
    ['수온', env.temp.toFixed(1) + '°C'],
    ['용존 산소', Math.round(env.oxygen * 100) + '%'],
    ['영양염', Math.round(env.nutrients * 100) + '%'],
    ['일광', Math.round(env.light * 100) + '%'],
    ['대발생', env.bloom > 0 ? '진행 중' : (env.bloomCd > 0 ? '휴식' : '—')],
  ];
  document.getElementById('envStats').innerHTML = items.map(([k, v]) =>
    `<div class="row"><span>${k}</span><b>${v}</b></div>`).join('');
}
function drawEnvChart() {
  const cv = document.getElementById('chEnv');
  const [c, w, h] = fitCanvas(cv, 110);
  const padL = 30, padB = 16, padT = 8, padR = 8;
  const maxV = 100;
  c.strokeStyle = 'rgba(120,190,230,0.12)'; c.lineWidth = 1;
  c.fillStyle = 'rgba(140,190,215,0.6)'; c.font = '10px sans-serif'; c.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const y = padT + (h - padT - padB) * i / 4;
    c.beginPath(); c.moveTo(padL, y); c.lineTo(w - padR, y); c.stroke();
    c.fillText(Math.round(maxV * (4 - i) / 4), padL - 5, y + 3);
  }
  const x0 = padL, x1 = w - padR;
  for (const s of ENV_SERIES) {
    const arr = hist[s.key];
    if (arr.length < 2) continue;
    const stride = Math.max(1, Math.ceil(arr.length / 150));
    c.strokeStyle = s.color; c.lineWidth = 1.8; c.lineJoin = 'round';
    c.beginPath();
    for (let i = 0; i < arr.length; i += stride) {
      const px = x0 + (x1 - x0) * (i / (HIST_MAX - 1));
      const y = padT + (h - padT - padB) * (1 - clamp(arr[i], 0, maxV) / maxV);
      if (i === 0) c.moveTo(px, y); else c.lineTo(px, y);
    }
    c.stroke();
    const lx = x0 + (x1 - x0) * ((arr.length - 1) / (HIST_MAX - 1));
    const ly = padT + (h - padT - padB) * (1 - clamp(arr[arr.length - 1], 0, maxV) / maxV);
    c.fillStyle = s.color;
    c.beginPath(); c.arc(lx, ly, 3, 0, TAU); c.fill();
  }
  document.getElementById('envLeg').innerHTML = ENV_SERIES.map(s =>
    `<span><span class="dot" style="background:${s.color}"></span>${s.name} ${hist[s.key].length ? hist[s.key][hist[s.key].length - 1] : 0}</span>`).join('');
}
function drawDash() {
  drawDex();
  drawEnvStats();
  drawEnvChart();
  drawLineChart();
  drawPie();
  drawGenStats();
  renderDashLog();
}
setInterval(() => { if (dashOpen) drawDash(); }, 500);
if (location.hash === '#dash') {
  dashOpen = true;
  dashEl.classList.add('open'); btnDash.classList.add('on');
  setTimeout(drawDash, 800);
}

/* ---------- 저장 UI · 자동저장 (v0.6) ---------- */
const saveModalEl = document.getElementById('saveModal');
const saveBoxEl = document.getElementById('saveBox');
function slotSummary(d) {
  if (d === 'corrupt') return '손상된 데이터 (자동 격리됨)';
  if (!d) return '비어 있음';
  const day = Math.floor((d.env.t || 0) / DAY_LEN);
  const when = new Date(d.savedAt);
  const mm = (when.getMonth() + 1) + '/' + when.getDate() + ' ' + String(when.getHours()).padStart(2, '0') + ':' + String(when.getMinutes()).padStart(2, '0');
  return day + '일차 · 도감 ' + (d.codex ? d.codex.length : 0) + '종 · ' + mm + ' 저장';
}
function renderSaveBox() {
  const cur = activeSlot();
  let html = '<h2>저장 관리</h2>';
  for (let n = 1; n <= 3; n++) {
    const d = readSlot(n);
    const has = d && d !== 'corrupt';
    html += `<div class="slot"><div class="st"><span>슬롯 ${n}${n === cur ? ' · 사용 중' : ''}</span><span>` +
      `<button class="sbtn" data-save="${n}">여기에 저장</button>` +
      (has ? `<button class="sbtn" data-load="${n}">불러오기</button>` : '') +
      `</span></div><div class="si">${slotSummary(d)}</div></div>`;
  }
  html += `<div class="foot"><button class="sbtn warn" id="btnNewTank">새 수족관</button><button class="sbtn" id="btnSaveClose">닫기</button></div>`;
  saveBoxEl.innerHTML = html;
  for (const b of saveBoxEl.querySelectorAll('[data-save]')) b.addEventListener('click', () => {
    try {
      localStorage.setItem(SAVE_KEY(+b.dataset.save), serialize());
      localStorage.setItem(SLOT_KEY, b.dataset.save);
    } catch {}
    renderSaveBox();
  });
  for (const b of saveBoxEl.querySelectorAll('[data-load]')) b.addEventListener('click', () => {
    try { localStorage.setItem(SLOT_KEY, b.dataset.load); } catch {}
    location.reload();
  });
  let newArmed = false;
  document.getElementById('btnNewTank').addEventListener('click', ev => {
    if (!newArmed) { newArmed = true; ev.target.textContent = '정말 초기화 — 한 번 더'; return; }
    try { localStorage.removeItem(SAVE_KEY(activeSlot())); } catch {}
    location.reload();
  });
  document.getElementById('btnSaveClose').addEventListener('click', () => saveModalEl.classList.remove('show'));
}
document.getElementById('btnSave').addEventListener('click', () => {
  renderSaveBox();
  saveModalEl.classList.add('show');
});
saveModalEl.addEventListener('click', e => { if (e.target === saveModalEl) saveModalEl.classList.remove('show'); });

/* 자동 저장: 15초 간격 + 페이지를 떠날 때 */
if (!IS_SIM) {
  setInterval(() => { try { localStorage.setItem(SAVE_KEY(activeSlot()), serialize()); } catch {} }, 15000);
  window.addEventListener('pagehide', () => { try { localStorage.setItem(SAVE_KEY(activeSlot()), serialize()); } catch {} });
}

/* ---------- 메인 루프 ---------- */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  if (dt > 0) fpsEma = fpsEma * 0.95 + (1 / dt) * 0.05;
  if (!paused) {
    const sdt = dt * speed;
    const steps = speed > 2 ? 2 : 1; // 고속일 때 두 번 나눠 안정성 확보
    for (let s = 0; s < steps; s++) step(sdt / steps);
  }
  const t = env.t;
  drawBackground(t);
  drawPlants(t);
  drawAlgae(t);
  drawDetritus();
  for (const f of herbs) drawFish(f, t, 'herb');
  for (const f of preds) drawFish(f, t, 'pred');
  drawBubbles();

  /* 선택 개체 강조 링 (v0.5) */
  if (selFish && (herbs.includes(selFish) || preds.includes(selFish))) {
    const rr = 16 * selFish.genes.size + 6;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,235,160,0.85)'; ctx.lineWidth = 1.6;
    ctx.setLineDash([5, 4]); ctx.lineDashOffset = -env.t * 20;
    ctx.beginPath(); ctx.arc(selFish.x, selFish.y, rr, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  /* --- 낮밤 · 이벤트 분위기 (v0.4) --- */
  if (env.bloom > 0) {
    ctx.fillStyle = `rgba(64,150,70,${0.10 * Math.min(1, env.bloom / 5)})`;
    ctx.fillRect(0, 0, W, H);
  }
  const nightA = (1 - env.light) * 0.52;
  if (nightA > 0.02) {
    ctx.fillStyle = `rgba(3,9,24,${nightA})`;
    ctx.fillRect(0, 0, W, H);
    /* 밤 반딧불 플랑크톤 */
    if (env.light < 0.3) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < motes.length; i += 3) {
        const m = motes[i];
        const tw = Math.max(0, Math.sin(t * 1.7 + m.ph * 3));
        ctx.fillStyle = `rgba(140,230,200,${tw * 0.35})`;
        ctx.beginPath(); ctx.arc((m.x * W + Math.sin(t * 0.3 + m.ph) * 12), ((m.y * H + t * m.sp * 3) % H), m.r * 0.9, 0, TAU); ctx.fill();
      }
      ctx.restore();
    }
  }
  updateHud(dt);
}
requestAnimationFrame(frame);

/* ---------- ?sim=N : 개입 없는 장기 안정성 검증 훅 ---------- */
const simQ = new URLSearchParams(location.search).get('sim');
if (simQ) {
  const total = Math.min(parseInt(simQ, 10) || 0, 3600);
  const rec = { seconds: total, min: { a: 1e9, h: 1e9, p: 1e9 }, max: { a: 0, h: 0, p: 0 }, events: [], oxyMin: 1, tempMin: 99, tempMax: -99 };
  let evAcc = 0;
  for (let i = 0; i < total * 10; i++) {
    step(0.1);
    if (i % 10 === 0) {
      rec.min.a = Math.min(rec.min.a, algae.length); rec.max.a = Math.max(rec.max.a, algae.length);
      rec.min.h = Math.min(rec.min.h, herbs.length); rec.max.h = Math.max(rec.max.h, herbs.length);
      rec.min.p = Math.min(rec.min.p, preds.length); rec.max.p = Math.max(rec.max.p, preds.length);
      rec.oxyMin = Math.min(rec.oxyMin, env.oxygen);
      rec.tempMin = Math.min(rec.tempMin, env.temp); rec.tempMax = Math.max(rec.tempMax, env.temp);
    }
  }
  rec.final = { a: algae.length, h: herbs.length, p: preds.length, day: env.day, oxygen: Math.round(env.oxygen * 100) / 100, temp: Math.round(env.temp * 10) / 10 };
  rec.events = logs.map(l => l.d + '일: ' + l.msg);
  rec.stats = stats;
  window.__simReport = rec;
  document.title = '[sim] ' + JSON.stringify(rec.final);
  const pre = document.createElement('pre'); pre.id = 'simout'; pre.textContent = JSON.stringify(rec); document.body.appendChild(pre);
}
