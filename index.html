<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>푸른 순환 — 생태계 수족관</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#04121f; }
  #sea { display:block; width:100vw; height:100vh; touch-action:none; }
  #hud {
    position:fixed; top:12px; left:12px; z-index:10;
    background:rgba(4,24,40,.62); backdrop-filter:blur(6px);
    border:1px solid rgba(120,200,255,.18); border-radius:12px;
    color:#cfe9f7; font-family:-apple-system,'Pretendard','Noto Sans KR',sans-serif;
    padding:10px 14px; font-size:13px; line-height:1.5; user-select:none;
    min-width:150px;
  }
  #hud h1 { margin:0 0 2px; font-size:15px; font-weight:700; color:#eaf6ff; letter-spacing:.02em; }
  #hud .ver { font-size:11px; color:#7fb6d9; margin-bottom:6px; }
  #hud .stat { display:flex; justify-content:space-between; gap:14px; }
  #hud .stat b { font-weight:600; color:#fff; font-variant-numeric:tabular-nums; }
  #hud .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  #controls { margin-top:8px; display:flex; gap:6px; }
  #controls button {
    flex:1; background:rgba(80,170,220,.16); color:#bfe4f7; border:1px solid rgba(120,200,255,.25);
    border-radius:8px; padding:5px 0; font-size:12px; cursor:pointer; font-family:inherit;
  }
  #controls button:hover { background:rgba(80,170,220,.3); }
  #controls button.on { background:rgba(90,200,180,.28); border-color:rgba(90,220,190,.5); color:#d8fff4; }
  #log {
    position:fixed; left:12px; bottom:12px; z-index:10; max-width:70vw;
    font-family:-apple-system,'Pretendard','Noto Sans KR',sans-serif;
    font-size:11px; color:rgba(180,220,240,.75); line-height:1.6; pointer-events:none;
    text-shadow:0 1px 3px rgba(0,0,0,.6);
  }
  #dash {
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    height:64vh; transform:translateY(102%); transition:transform .28s ease;
    background:rgba(3,18,30,.92); backdrop-filter:blur(10px);
    border-top:1px solid rgba(120,200,255,.25); border-radius:18px 18px 0 0;
    color:#cfe9f7; font-family:-apple-system,'Pretendard','Noto Sans KR',sans-serif;
    overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 16px 26px;
  }
  #dash.open { transform:translateY(0); }
  #dashHead {
    position:sticky; top:0; z-index:2; display:flex; justify-content:space-between; align-items:center;
    background:rgba(3,18,30,.96); padding:12px 2px 10px; font-size:15px; font-weight:700; color:#eaf6ff;
    border-bottom:1px solid rgba(120,200,255,.12);
  }
  #btnDashClose {
    background:rgba(80,170,220,.16); color:#bfe4f7; border:1px solid rgba(120,200,255,.25);
    border-radius:8px; padding:5px 14px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  #dash .sec { margin-top:18px; }
  #dash .secT { font-size:12px; color:#7fb6d9; margin-bottom:8px; letter-spacing:.02em; }
  #dash canvas.chart { width:100%; display:block; background:rgba(10,35,55,.4); border-radius:10px; }
  #dash .leg { display:flex; flex-wrap:wrap; gap:12px; margin-top:6px; font-size:11px; color:#a9cede; }
  #dash .leg .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:5px; }
  #dash .gstat { display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; font-size:12.5px; }
  #dash .gstat .row { display:flex; justify-content:space-between; background:rgba(10,35,55,.4); border-radius:8px; padding:7px 10px; }
  #dash .gstat .row b { color:#fff; font-variant-numeric:tabular-nums; }
  #dashLog { font-size:12px; line-height:1.75; color:#a9cede; }
  #dexGrid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  #dexGrid .m { display:flex; align-items:center; gap:7px; background:rgba(10,35,55,.4); border-radius:8px; padding:6px 8px; font-size:11px; color:#a9cede; }
  #dexGrid .m .dot { flex:none; width:14px; height:14px; border-radius:50%; box-shadow:0 0 6px rgba(255,255,255,.25) inset; }
  #dexGrid .m .nm { color:#dceef8; }
  #dexGrid .m .rr { margin-left:auto; flex:none; font-size:9.5px; padding:1px 6px; border-radius:6px; }
  /* 도감 검색·필터·정렬 (v1.7) */
  #dexTools { display:flex; flex-direction:column; gap:6px; margin-bottom:7px; }
  #dexQ {
    width:100%; box-sizing:border-box; background:rgba(10,35,55,.55); border:1px solid rgba(120,190,230,.25);
    border-radius:8px; color:#dceef8; font-size:12px; padding:6px 9px; font-family:inherit;
  }
  #dexQ::placeholder { color:#5f96b5; }
  .dexChipRow { display:flex; flex-wrap:wrap; gap:4px; }
  .dexChipRow button {
    background:rgba(10,35,55,.4); border:1px solid rgba(120,190,230,.18); border-radius:7px;
    color:#8fb4c8; font-size:10.5px; padding:3px 8px; cursor:pointer; font-family:inherit;
  }
  .dexChipRow button.on { background:rgba(80,150,190,.85); color:#04121e; font-weight:700; }
  #dexSort {
    background:rgba(10,35,55,.55); border:1px solid rgba(120,190,230,.25); border-radius:8px;
    color:#a9cede; font-size:11.5px; padding:5px 8px; font-family:inherit; width:100%;
  }
  /* 도감 즐겨찾기 (v1.10) */
  #dexGrid .m .favBtn { flex:none; background:none; border:none; cursor:pointer; font-size:13px; padding:2px 3px 2px 0; color:#4e7d99; font-family:inherit; line-height:1; }
  #dexGrid .m .favBtn.on { color:#ffd35c; text-shadow:0 0 7px rgba(255,211,92,.55); }
  .rr.c0 { background:rgba(120,150,170,.25); color:#9fb8c8; }
  .rr.c1 { background:rgba(80,160,120,.3); color:#9fe0b8; }
  .rr.c2 { background:rgba(70,130,220,.35); color:#a9ccff; }
  .rr.c3 { background:rgba(200,120,40,.4); color:#ffd9a0; }
  #inspect {
    position:fixed; left:16px; right:16px; bottom:16px; z-index:5;
    background:rgba(8,26,42,.92); border:1px solid rgba(130,200,240,.35); border-radius:12px;
    padding:10px 12px; font-size:12px; color:#a9cede; display:none; backdrop-filter:blur(4px);
  }
  #inspect.show { display:block; }
  #inspect .ih { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  #inspect .idot { width:16px; height:16px; border-radius:50%; }
  #inspect .inm { color:#fff; font-weight:700; }
  #inspect .ix { margin-left:auto; background:none; border:1px solid rgba(130,200,240,.4); color:#a9cede; border-radius:8px; padding:2px 9px; font-size:11px; cursor:pointer; }
  #inspect .igrid { display:grid; grid-template-columns:1fr 1fr; gap:3px 12px; font-variant-numeric:tabular-nums; }
  #inspect .igrid b { color:#dceef8; font-weight:600; }
  #dashLog .d { color:#5f96b5; margin-right:6px; font-variant-numeric:tabular-nums; }
  /* 도전 과제 (v1.0) */
  #achGrid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  #achGrid .a { background:rgba(10,35,55,.4); border:1px solid transparent; border-radius:8px; padding:6px 8px; font-size:11px; color:#8fb4c8; }
  #achGrid .a .nm { color:#dceef8; font-weight:600; }
  #achGrid .a.done { border-color:rgba(240,205,110,.45); background:rgba(60,48,16,.3); color:#cbb98a; }
  #achGrid .a.done .nm { color:#f2d98a; }
  #achGrid .a.lock { opacity:.55; }
  #toasts { position:fixed; left:50%; bottom:64px; transform:translateX(-50%); z-index:35; pointer-events:none; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .toast {
    background:rgba(24,20,8,.92); border:1px solid rgba(240,205,110,.55); color:#f2d98a;
    border-radius:12px; padding:9px 16px; font-size:13px; text-align:center; max-width:86vw;
    box-shadow:0 4px 18px rgba(0,0,0,.5);
    animation:toastIn .45s ease-out, toastOut .6s ease-in forwards;
    animation-delay:0s, 3.8s;
  }
  .toast b { display:block; font-size:14px; margin-bottom:2px; }
  .toast span { color:#cbb98a; font-size:11.5px; }
  @keyframes toastIn { from { opacity:0; transform:translateY(16px) scale(.92); } to { opacity:1; transform:none; } }
  @keyframes toastOut { to { opacity:0; transform:translateY(-10px); } }
  /* 가계 · 연대기 (v1.2) */
  #lineGrid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  #lineGrid .a { background:rgba(10,35,55,.4); border:1px solid rgba(120,190,230,.18); border-radius:8px; padding:6px 8px; font-size:11px; color:#8fb4c8; }
  #lineGrid .a .nm { color:#dceef8; font-weight:600; }
  #chronList { font-size:12px; line-height:1.75; color:#a9cede; }
  #chronList .d { color:#5f96b5; margin-right:6px; font-variant-numeric:tabular-nums; }
  /* 사운드 행 (v0.9) */
  #sndRow { margin-top:6px; display:flex; gap:6px; align-items:center; }
  #sndRow #btnSnd {
    background:rgba(80,170,220,.16); color:#bfe4f7; border:1px solid rgba(120,200,255,.25);
    border-radius:8px; padding:3px 8px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  #sndRow #btnSnd.off { opacity:.5; }
  #sndRow input[type=range] { flex:1; height:3px; accent-color:#6fc3e8; cursor:pointer; }
  /* 꾸미기 팔레트 (v0.8) */
  #decoBar {
    display: none; position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    background: rgba(6,18,30,0.92); border: 1px solid rgba(120,190,230,0.25); border-radius: 14px;
    padding: 8px; gap: 6px; z-index: 30; flex-wrap: wrap; justify-content: center; max-width: 94vw;
  }
  #decoBar.show { display: flex; }
  #decoBar button {
    background: rgba(30,60,86,0.8); color: #cfe8f4; border: 1px solid rgba(120,190,230,0.3);
    border-radius: 9px; padding: 7px 10px; font-size: 13px; cursor: pointer;
  }
  #decoBar button.on { background: rgba(80,150,190,0.9); color: #04121e; font-weight: 700; }
  /* 먹이 팔레트 (v1.8) */
  #feedBar {
    display: none; position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    background: rgba(6,18,30,0.92); border: 1px solid rgba(120,190,230,0.25); border-radius: 14px;
    padding: 8px; gap: 6px; z-index: 31; flex-wrap: wrap; justify-content: center; max-width: 94vw;
  }
  #feedBar.show { display: flex; }
  #feedBar button {
    background: rgba(30,60,86,0.8); color: #cfe8f4; border: 1px solid rgba(120,190,230,0.3);
    border-radius: 9px; padding: 7px 10px; font-size: 13px; cursor: pointer;
  }
  #feedBar button.on { background: rgba(80,150,190,0.9); color: #04121e; font-weight: 700; }
  #feedBar button small { display: block; font-size: 10px; opacity: .75; margin-top: 1px; font-weight: 400; }
  /* 사진 모드 (v1.1) */
  #photoModal {
    position:fixed; inset:0; z-index:32; display:none; align-items:center; justify-content:center;
    background:rgba(2,8,16,.72); backdrop-filter:blur(3px);
  }
  #photoModal.show { display:flex; }
  #photoBox {
    background:rgba(8,22,36,.96); border:1px solid rgba(120,190,230,.28); border-radius:14px;
    padding:12px 14px; max-width:94vw; display:flex; flex-direction:column; gap:8px; align-items:center;
  }
  #photoBox h2 { margin:0; font-size:15px; color:#dceef8; }
  #photoImg { max-width:88vw; max-height:58vh; border-radius:10px; border:1px solid rgba(120,190,230,.2); }
  #photoCardRow { font-size:12px; color:#8fb4c8; display:flex; gap:5px; align-items:center; cursor:pointer; }
  #photoCardRow input { accent-color:#6fc3e8; }
  #photoBtns { display:flex; gap:8px; }
  #photoBtns button {
    background:rgba(30,60,86,.8); color:#cfe8f4; border:1px solid rgba(120,190,230,.3);
    border-radius:9px; padding:7px 14px; font-size:13px; cursor:pointer; font-family:inherit;
  }
  #photoBtns button:hover { background:rgba(60,110,150,.85); }
  /* 타임랩스 (v1.6) */
  #lapseModal {
    position:fixed; inset:0; z-index:32; display:none; align-items:center; justify-content:center;
    background:rgba(2,8,16,.72); backdrop-filter:blur(3px);
  }
  #lapseModal.show { display:flex; }
  #lapseBox {
    background:rgba(8,22,36,.96); border:1px solid rgba(120,190,230,.28); border-radius:14px;
    padding:12px 14px; max-width:94vw; display:flex; flex-direction:column; gap:8px; align-items:center;
  }
  #lapseBox h2 { margin:0; font-size:15px; color:#dceef8; }
  #lapseVid { max-width:88vw; max-height:58vh; border-radius:10px; border:1px solid rgba(120,190,230,.2); background:#04121e; }
  #lapseNote { font-size:11px; color:#8fb4c8; }
  #lapseBtns { display:flex; gap:8px; }
  #lapseBtns button {
    background:rgba(30,60,86,.8); color:#cfe8f4; border:1px solid rgba(120,190,230,.3);
    border-radius:9px; padding:7px 14px; font-size:13px; cursor:pointer; font-family:inherit;
  }
  #btnLapse.rec { background:rgba(190,50,50,.9) !important; color:#fff !important; border-color:rgba(255,120,120,.6) !important; }
  /* 저장 모달 · 정산 카드 (v0.6) */
  #saveModal {
    position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center;
    background:rgba(2,8,16,.6); backdrop-filter:blur(3px);
  }
  #saveModal.show { display:flex; }
  #saveBox {
    width:min(340px, calc(100vw - 32px)); background:rgba(8,26,42,.97); border:1px solid rgba(130,200,240,.35);
    border-radius:14px; padding:14px; font-size:12.5px; color:#a9cede;
  }
  #saveBox h2 { margin:0 0 10px; font-size:15px; color:#fff; }
  #saveBox .slot { background:rgba(10,35,55,.5); border-radius:10px; padding:9px 10px; margin-bottom:8px; }
  #saveBox .slot .st { display:flex; justify-content:space-between; align-items:center; }
  #saveBox .slot .si { color:#7fb6d9; font-size:11px; margin-top:2px; min-height:14px; }
  #saveBox .sbtn { background:rgba(70,130,180,.3); border:1px solid rgba(130,200,240,.4); color:#dceef8; border-radius:8px; padding:3px 10px; font-size:11.5px; cursor:pointer; margin-left:6px; }
  #saveBox .sbtn.warn { border-color:rgba(240,160,120,.5); color:#ffc9a8; }
  #saveBox .foot { display:flex; justify-content:space-between; margin-top:10px; }
  #settle {
    position:fixed; left:16px; right:16px; top:30%; z-index:25; display:none;
    background:rgba(8,26,42,.95); border:1px solid rgba(130,200,240,.4); border-radius:14px;
    padding:14px; font-size:12.5px; color:#a9cede; line-height:1.7;
  }
  #settle.show { display:block; }
  #settle h3 { margin:0 0 6px; font-size:14px; color:#fff; }
  #settle b { color:#dceef8; }
  #settle button { margin-top:10px; width:100%; background:rgba(70,130,180,.35); border:1px solid rgba(130,200,240,.45); color:#fff; border-radius:9px; padding:7px; font-size:13px; cursor:pointer; }
  /* 수조 확장 (v1.9) */
  #tankRow { margin-top:6px; }
  #tankRow button {
    width:100%; background:rgba(80,170,220,.16); color:#bfe4f7; border:1px solid rgba(120,200,255,.25);
    border-radius:8px; padding:5px 0; font-size:12px; cursor:pointer; font-family:inherit;
  }
  #tankRow button:hover { background:rgba(80,170,220,.3); }
  #tankModal {
    position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center;
    background:rgba(2,8,16,.6); backdrop-filter:blur(3px);
  }
  #tankModal.show { display:flex; }
  #tankBox {
    width:min(340px, calc(100vw - 32px)); background:rgba(8,26,42,.97); border:1px solid rgba(130,200,240,.35);
    border-radius:14px; padding:14px; font-size:12.5px; color:#a9cede; max-height:80vh; overflow-y:auto;
  }
  #tankBox h2 { margin:0 0 10px; font-size:15px; color:#fff; }
  #tankBox .slot { background:rgba(10,35,55,.5); border-radius:10px; padding:9px 10px; margin-bottom:8px; }
  #tankBox .slot .st { display:flex; justify-content:space-between; align-items:center; }
  #tankBox .slot .si { color:#7fb6d9; font-size:11px; margin-top:2px; min-height:14px; }
  #tankBox .tstats { font-size:11.5px; margin-top:6px; line-height:1.8; color:#8fb4c8; }
  #tankBox .trow { display:flex; justify-content:space-between; gap:10px; }
  #tankBox .trow b { color:#dceef8; font-weight:600; text-align:right; }
  #tankBox .sbtn { background:rgba(70,130,180,.3); border:1px solid rgba(130,200,240,.4); color:#dceef8; border-radius:8px; padding:3px 10px; font-size:11.5px; cursor:pointer; margin-left:6px; }
  #tankBox .foot { display:flex; justify-content:space-between; align-items:center; margin-top:10px; gap:8px; }
  #hint {
    position:fixed; right:12px; bottom:12px; z-index:10;
    font-family:-apple-system,'Pretendard','Noto Sans KR',sans-serif;
    font-size:11px; color:rgba(150,200,225,.55); pointer-events:none;
  }
</style>
</head>
<body>
<canvas id="sea"></canvas>
<div id="hud">
  <h1>푸른 순환</h1>
  <div class="ver">생태계 수족관 · v1.16 · <span id="cFps">--</span>fps</div>
  <div class="stat"><span><span class="dot" style="background:#69d67c"></span>조류</span><b id="cAlgae">0</b></div>
  <div class="stat"><span><span class="dot" style="background:#8fd3e8"></span>초식어</span><b id="cHerb">0</b></div>
  <div class="stat"><span><span class="dot" style="background:#f0918a"></span>포식자</span><b id="cPred">0</b></div>
  <div class="stat"><span><span class="dot" style="background:#e8c39a"></span>새우</span><b id="cShrimp">0</b></div>
  <div class="stat"><span><span class="dot" style="background:#c9a8f0"></span>해파리</span><b id="cJelly">0</b></div>
  <div class="stat"><span><span class="dot" style="background:#93a8c8"></span>대형</span><b id="cApex">0</b></div>
  <div class="stat"><span>경과</span><b id="cTime">0일</b></div>
  <div id="controls">
    <button id="btnPause">일시정지</button>
    <button id="btnSpeed">1×</button>
    <button id="btnFeed">먹이</button>
    <button id="btnDeco">꾸미기</button>
    <button id="btnDash">지표</button>
    <button id="btnSave">저장</button>
    <button id="btnPhoto" title="사진 모드">📸</button>
    <button id="btnLapse" title="타임랩스 녹화">📹</button>
  </div>
  <div id="sndRow">
    <button id="btnSnd" title="소리 켜기/끄기">🔊</button>
    <input id="volRange" type="range" min="0" max="100" value="50" aria-label="음량">
  </div>
  <div id="tankRow"><button id="btnTank" title="수조 관리 · 생태계 비교">🛁 1호 수조</button></div>
</div>
<div id="inspect"></div>
<div id="settle"></div>
<div id="saveModal"><div id="saveBox"></div></div>
<div id="tankModal"><div id="tankBox"></div></div>
<div id="photoModal">
  <div id="photoBox">
    <h2>📸 사진 모드</h2>
    <img id="photoImg" alt="수족관 사진 미리보기">
    <label id="photoCardRow"><input type="checkbox" id="photoCard" checked> 기록 카드 포함</label>
    <div id="photoBtns">
      <button id="btnPhotoDl">저장</button>
      <button id="btnPhotoShare">공유</button>
      <button id="btnPhotoClose">닫기</button>
    </div>
  </div>
</div>
<div id="lapseModal">
  <div id="lapseBox">
    <h2>📹 타임랩스</h2>
    <video id="lapseVid" controls loop muted playsinline></video>
    <div id="lapseNote"></div>
    <div id="lapseBtns">
      <button id="btnLapseDl">저장</button>
      <button id="btnLapseShare">공유</button>
      <button id="btnLapseClose">닫기</button>
    </div>
  </div>
</div>
<div id="decoBar">
  <button data-tool="rock" class="on">🪨 바위</button>
  <button data-tool="coral">🪸 산호</button>
  <button data-tool="plant">🌿 수초</button>
  <button data-tool="erase">✕ 지우기</button>
  <button id="decoTheme">🎨 배경</button>
  <button id="decoDone">완료</button>
</div>
<div id="feedBar">
  <button data-feed="algae" class="on">🌿 조류 먹이<small>초식어 · 산란↑</small></button>

<script>
'use strict';
/* ============================================================
   푸른 순환 v1.16 — 생태계 수족관 (신규 업적: 두 수조·이주·즐겨찾기·사냥 100회 · v1.14 사냥 성향)
   생산자(조류/수초) → 초식어 → 포식자, 개체 단위 시뮬레이션
   ============================================================ */
const canvas = document.getElementById('sea');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();

/* ---------- 유틸 ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const TAU = Math.PI * 2;

/* ---------- 공간 해시 (이웃 탐색) ---------- */
class Grid {
  constructor(cell) { this.cell = cell; this.map = new Map(); }
  key(x, y) { return ((x / this.cell) | 0) * 100000 + ((y / this.cell) | 0); }
  clear() { this.map.clear(); }
  add(o) {
    const k = this.key(o.x, o.y);
    let arr = this.map.get(k);
    if (!arr) { arr = []; this.map.set(k, arr); }
    arr.push(o);
  }
  near(x, y, r, out) {
    out.length = 0;
    const c = this.cell;
    const x0 = ((x - r) / c) | 0, x1 = ((x + r) / c) | 0;
    const y0 = ((y - r) / c) | 0, y1 = ((y + r) / c) | 0;
    for (let gx = x0; gx <= x1; gx++) for (let gy = y0; gy <= y1; gy++) {
      const arr = this.map.get(gx * 100000 + gy);
      if (arr) for (let i = 0; i < arr.length; i++) out.push(arr[i]);
    }
    return out;
  }
}
const _near = [];
/* ---------- 수조 상태 (v1.9) — 수조별 상태는 makeTank에, 전역은 지금 시뮬레이션/렌더 중인 수조의 별칭 ----------
   bindTank(tk)로 바꿔 끼우며, 기존 코드는 전역 별칭을 그대로 쓴다 (배열·객체는 제자리 변경이라 별칭이 따라감) */
let env, hist, algae, plants, decorations, detritus, meatPellets, planktons;
let herbs, preds, shrimps, jellies, apexes, bubbles, herbGrid, algaeGrid, theme, feedBuff, autoFeedCd;
function makeTank(idx) {
  return {
    idx, open: idx === 0, acc: 0,
    name: (idx + 1) + '호 수조',
    env: { nutrients: 0.6, oxygen: 0.8, temp: 22, light: 1, bloom: 0, bloomCd: 0, predRescue: -1,
           seasonEv: null, seasonLast: -1, t: 0, day: 0 },
    hist: { a: [], h: [], p: [], s: [], j: [], x: [], o: [], tp: [] },
    histAcc: 0,
    st: { births: 0, deaths: 0, hunts: 0 },   /* 수조별 누적 — 생태계 비교용 */
    huntStyle: 1,                            /* 포식자 사냥 성향 0신중 1균형 2적극 (v1.14) */
    algae: [], plants: [], decorations: [], detritus: [], meatPellets: [], planktons: [],
    herbs: [], preds: [], shrimps: [], jellies: [], apexes: [], bubbles: [],
    herbGrid: new Grid(64), algaeGrid: new Grid(48),
    theme: idx === 0 ? 0 : 1,               /* 2호는 에메랄드 라군이 기본 — 한눈에 구분 */
    feedBuff: { herb: 0, pred: 0, shrimp: 0, jelly: 0 },
    autoFeedCd: { algae: 0, meat: 0, crumb: 0, plankton: 0 },
  };
}
const tanks = [makeTank(0), makeTank(1)];
let migAcc = 0;            /* 연결 수로 이주 타이머 — startSettle이 부팅 중 호출하므로 상단 선언 (TDZ 방지) */
let curTank = tanks[0];
let viewTank = 0;      /* 화면에 보이는 수조 */
let waterway = true;   /* 연결 수로 — 열려 있으면 개체가 알아서 오감 (위임 기본 ON) */
function bindTank(tk) {
  curTank = tk;
  env = tk.env; hist = tk.hist;
  algae = tk.algae; plants = tk.plants; decorations = tk.decorations; detritus = tk.detritus;
  meatPellets = tk.meatPellets; planktons = tk.planktons;
  herbs = tk.herbs; preds = tk.preds; shrimps = tk.shrimps; jellies = tk.jellies; apexes = tk.apexes;
  bubbles = tk.bubbles;
  herbGrid = tk.herbGrid; algaeGrid = tk.algaeGrid;
  theme = tk.theme; feedBuff = tk.feedBuff; autoFeedCd = tk.autoFeedCd;
}
bindTank(tanks[0]);

/* ---------- 환경 ---------- */
/* env는 수조별 — makeTank 참조 (v1.9) */
const DAY_LEN = 45;
/* 낮밤 주기: 하루 45초, 한낮(p=0.5)에 최대, 자정(p=0/1)에 최소 */
function daylight(tt) {
  const p = (tt % DAY_LEN) / DAY_LEN;
  return clamp(0.10 + 0.90 * Math.max(0, Math.sin(p * Math.PI)) ** 1.2, 0, 1);
}
function phaseLabel() {
  const p = (env.t % DAY_LEN) / DAY_LEN;
  if (p < 0.16) return '새벽';
  if (p < 0.38) return '아침';
  if (p < 0.62) return '낮';
  if (p < 0.84) return '황혼';
  return '밤';
}

/* ---------- 통계 · 이력 (v0.3 대시보드) ---------- */
const stats = { births: 0, deaths: 0, hunts: 0, mutations: 0, maxGenHerb: 1, maxGenPred: 1 };
const HIST_MAX = 600; // 0.5초 × 600 = 5분
/* hist·histAcc는 수조별 — makeTank 참조 (v1.9) */

/* ---------- 업적 상태 (v1.0) — 선언 위치 주의: initWorld가 부팅 시 참조하므로 반드시 상단 ---------- */
const ach = {}; /* id → 달성 일자 */
let achQuiet = true; /* 로드 직후 첫 평가는 이미 이룬 기록이므로 조용히 반영 */

/* ---------- 이름 · 가계 · 연대기 상태 (v1.2) — 상단 선언 필수: initWorld 부팅 참조 ---------- */
const NAME_A = ['별','물','파','은','초','달','바','소','여','해','잔','모','봄','빛','안','청'];
const NAME_B = ['나','리','솔','루','미','결','랑','름','온','기','치','비','로','새','무','연'];
function nameTaken(n) {
  for (const tk of tanks) for (const arr of [tk.herbs, tk.preds, tk.shrimps, tk.jellies, tk.apexes]) for (const f of arr) if (f.name === n) return true;
  return false;
}
function genName() {
  let n = NAME_A[(Math.random() * NAME_A.length) | 0] + NAME_B[(Math.random() * NAME_B.length) | 0];
  if (nameTaken(n)) n += NAME_B[(Math.random() * NAME_B.length) | 0];
  return n;
}
function nameFish(f, isBorn, parentLine) {
  f.name = genName();
  f.line = (isBorn && parentLine) ? parentLine : f.name + '가';
}
const chronicle = []; /* 수족관 연대기 — {d, msg}, 최대 80 */
const DAY_MARKS = [10, 30, 50, 100, 200, 365];
const GEN_MARKS = [5, 10, 20];
const storyState = { lines: null, dayMarks: new Set(), genMarks: new Set() };
function addChron(msg) {
  chronicle.push({ d: env.day, msg });
  if (chronicle.length > 80) chronicle.shift();
  if (typeof dashOpen !== 'undefined' && dashOpen) drawChron();
}

/* ---------- 계절 · 장기 이벤트 (v1.4) — 상단 선언 필수: initWorld 부팅 참조 ----------
   12일 = 한 계절, 48일 순환. 개입 불필요 · 실패 잠금 없음 — 효과는 완만한 조절뿐 */
const SEASON_LEN = 12;
const SEASONS = [
  { icon: '🌸', name: '봄',  label: '산란기', breed: 0.88, meta: 1,    algae: 1,    oxy: 1, tempAdd: 0,   tint: 'rgba(130,220,160,0.045)' },
  { icon: '🌞', name: '여름', label: '번영기', breed: 1,    meta: 1,    algae: 1.25, oxy: 1, tempAdd: 1.5, tint: 'rgba(255,196,84,0.05)' },
  { icon: '🍂', name: '가을', label: '풍요기', breed: 1,    meta: 0.95, algae: 1,    oxy: 1, tempAdd: 0,   tint: 'rgba(255,148,64,0.05)' },
  { icon: '❄️', name: '겨울', label: '인내기', breed: 1.08, meta: 0.92, algae: 1,    oxy: 1, tempAdd: -2,  tint: 'rgba(140,180,255,0.075)' },
];
const SEASON_EVENTS = {
  redtide:  { icon: '🟥', name: '적조', seasons: [1], oxy: 0.85, algae: 1.35, breed: 1,    meta: 1,   tempAdd: 0,    tint: 'rgba(196,60,60,0.09)',
              startMsg: '적조가 들이닥쳤다 — 붉은 물빛이 며칠간 이어진다', endMsg: '적조가 물러가 물이 맑아졌다' },
  coldsnap: { icon: '🌬️', name: '한파', seasons: [3], oxy: 1,    algae: 1,    breed: 1.12, meta: 0.9, tempAdd: -3.5, tint: 'rgba(165,205,255,0.11)',
              startMsg: '한파가 찾아왔다 — 수온이 뚝 떨어진다', endMsg: '한파가 물러가 수온이 돌아왔다' },
};
function seasonIdx(day) { const c = SEASON_LEN * 4; return Math.floor((((day % c) + c) % c) / SEASON_LEN); }
function seasonNow() { return SEASONS[seasonIdx(env.day)]; }
function seasonEventNow() { return (env.seasonEv && env.day < env.seasonEv.until) ? env.seasonEv : null; }
/* 계절 강도 (v1.12) — 0%면 계절 영향 없음, 100% 기본, 150%까지. 기기에 보관 */
let seasonScale = 1;
try { const _sv = parseFloat(localStorage.getItem('blueCycle.seasonScale')); if (isFinite(_sv)) seasonScale = Math.min(1.5, Math.max(0, _sv)); } catch (e) {}
function seasonMods() {
  const s = seasonNow(), m = { breed: s.breed, meta: s.meta, algae: s.algae, oxy: s.oxy, tempAdd: s.tempAdd };
  const ev = seasonEventNow();
  if (ev) { const E = SEASON_EVENTS[ev.id]; if (E) { m.breed *= E.breed; m.meta *= E.meta; m.algae *= E.algae; m.oxy *= E.oxy; m.tempAdd += E.tempAdd; } }
  if (seasonScale !== 1) { m.breed = 1 + (m.breed - 1) * seasonScale; m.meta = 1 + (m.meta - 1) * seasonScale; m.algae = 1 + (m.algae - 1) * seasonScale; m.oxy = 1 + (m.oxy - 1) * seasonScale; m.tempAdd *= seasonScale; }
  return m;
}
function seasonTint() {
  const ev = seasonEventNow();
  if (ev && SEASON_EVENTS[ev.id]) return SEASON_EVENTS[ev.id].tint;
  return seasonNow().tint;
}

/* ---------- 혈통 계보 (v1.5) — 상단 선언 필수: initWorld 부팅 참조 ----------
   혈통의 탄생(정착)·세대 성장·단절을 누적 기록해 대시보드 계보도에 그림 */
const lineBook = new Map(); /* 'kind:line' → {kind, ko, line, founded, founder, births, maxGen, extinct} */
const LINE_BOOK_MAX = 120;
const LINE_KIND_COLOR = { herb: '#8fd3e8', pred: '#f0918a', shrimp: '#e8c39a', jelly: '#c9a8f0', apex: '#93a8c8' };
function lineBookRecord(kind, ko, f, isBorn) {
  if (!f.line) return;
  const key = kind + ':' + f.line;
  let e = lineBook.get(key);
  if (!e) {
    e = { kind, ko, line: f.line, founded: env.day, founder: isBorn ? null : f.name, births: 0, maxGen: f.gen, extinct: null };
    lineBook.set(key, e);
    if (lineBook.size > LINE_BOOK_MAX) {
      let oldestKey = null, oldestDay = Infinity;
      for (const [k, v] of lineBook) if (v.extinct !== null && v.extinct < oldestDay) { oldestDay = v.extinct; oldestKey = k; }
      lineBook.delete(oldestKey !== null ? oldestKey : lineBook.keys().next().value);
    }
  }
  if (f.gen > e.maxGen) e.maxGen = f.gen;
  if (isBorn) e.births++;
}

/* ---------- 도감 · 유전 (v0.5) ---------- */
const HUE_BANDS = [
  [15, '붉은'], [45, '주황'], [75, '황금'], [105, '연두'], [150, '초록'], [180, '청록'],
  [210, '하늘'], [240, '파란'], [270, '남빛'], [300, '보라'], [330, '자주'], [360, '붉은'],
];
function hueName(h) { for (const [lim, n] of HUE_BANDS) if (h < lim) return n; return '붉은'; }
function sizeName(v) { return v < 0.9 ? '작은' : v > 1.12 ? '큰' : ''; }
function speedName(v) { return v < 0.92 ? '느린' : v > 1.1 ? '빠른' : ''; }
const RARITY = ['흔함', '드묾', '희귀', '전설'];
const HUNT_STYLES = ['신중', '균형', '적극'];       /* 사냥 성향 (v1.14) — 신중: 아껴 사냥, 적극: 활발히 사냥 */
const HUNT_STYLE_MUL = [0.72, 1, 1.12];
const KIND_INFO = {
  herb:   { baseHue: 190, sp: '초식어' },
  pred:   { baseHue: 0,   sp: '포식어' },
  shrimp: { baseHue: 25,  sp: '새우' },
  jelly:  { baseHue: 280, sp: '해파리' },
  apex:   { baseHue: 215, sp: '대형 포식어' },
};
function morphOf(kind, g) {
  const baseHue = (KIND_INFO[kind] || KIND_INFO.herb).baseHue;
  let hd = Math.abs(g.hue - baseHue); if (hd > 180) hd = 360 - hd;
  const dev = Math.abs(g.size - 1) / 0.45 + Math.abs(g.speed - 1) / 0.35 + hd / 120;
  const rarity = dev < 0.3 ? 0 : dev < 0.65 ? 1 : dev < 1.05 ? 2 : 3;
  const adj = [sizeName(g.size), speedName(g.speed)].filter(Boolean).join(' ');
  const sp = (KIND_INFO[kind] || KIND_INFO.herb).sp;
  return {
    key: kind + ':' + hueName(g.hue) + ':' + (sizeName(g.size) || '보통') + ':' + (speedName(g.speed) || '보통'),
    name: hueName(g.hue) + '빛' + (adj ? ' ' + adj : '') + ' ' + sp,
    rarity, hue: g.hue,
  };
}
const codex = new Map(); // key -> {name, rarity, hue, kind, firstDay, seen}
function recordMorph(kind, g) {
  if (restoring) return null;
  const m = morphOf(kind, g);
  const e = codex.get(m.key);
  if (e) { e.seen++; return e; }
  codex.set(m.key, { ...m, kind, firstDay: env.day, seen: 1 });
  if (m.rarity >= 2) { addLog((m.rarity === 3 ? '전설의' : '희귀한') + ' 변이 발견: ' + m.name); sfx(m.rarity === 3 ? 'legend' : 'rare'); if (m.rarity === 3) stats.legendFound = (stats.legendFound || 0) + 1; else stats.rareFound = (stats.rareFound || 0) + 1; }
  return codex.get(m.key);
}

/* ---------- 조류 (부유 먹이 알갱이) ---------- */
const ALGAE_MAX = 260;
/* 수조별 — makeTank 참조 (v1.9) */
function spawnAlgae(x, y, big) {
  if (algae.length >= ALGAE_MAX) return;
  algae.push({
    x: x !== undefined ? x : rand(10, W - 10),
    y: y !== undefined ? y : rand(H * 0.15, H * 0.9),
    vx: rand(-4, 4), vy: rand(-2, 2),
    r: big ? rand(3.2, 4.6) : rand(1.6, 3.0),
    e: big ? 26 : rand(10, 18),
    ph: rand(0, TAU),
  });
}

/* ---------- 수초 (바닥 생산자) ---------- */
/* 수조별 — makeTank 참조 (v1.9) */
function makePlants() {
  plants.length = 0;
  const n = Math.max(6, (W / 90) | 0);
  for (let i = 0; i < n; i++) {
    plants.push({
      x: (i + rand(0.2, 0.8)) / n * W,
      blades: (rand(4, 8)) | 0,
      h: rand(50, Math.min(150, H * 0.28)),
      grow: rand(0.6, 1),
      ph: rand(0, TAU),
      spore: rand(2, 6),
    });
  }
}
makePlants();

/* ---------- 장식 · 배경 테마 (v0.8) ---------- */
const DECO_MAX = { rock: 8, coral: 8, plant: 10 };
/* 수조별 — makeTank 참조 (v1.9) */

      const g = { size: clamp(sz, 0.75, 1.45), speed: clamp(sp, 0.75, 1.35), hue: ((hue % 360) + 360) % 360 };
      const f = kind === 'herb'
        ? spawnHerb(clamp(x, 12, W - 12), clamp(y, 14, H - 22), g, (gen | 0) || 1)
        : spawnPred(clamp(x, 16, W - 16), clamp(y, 16, H - 30), g, (gen | 0) || 1);
      if (f) { f.energy = clamp(e || 50, 1, 110); f.age = Math.max(0, age || 0);
        if (typeof nm === 'string' && nm) { f.name = nm; f.line = (typeof ln === 'string' && ln) ? ln : nm + '가'; } }
    }
  };
  unpack(d.herbs.slice(0, HERB_MAX), 'herb');
  unpack(d.preds.slice(0, PRED_MAX), 'pred');
  const unpackNew = (arr, kind, cap, spawner) => {
    for (const p of (arr || []).slice(0, cap)) {
      if (!Array.isArray(p)) continue;
      const [x, y, e, age, gen, sz, sp, hue, nm, ln] = p;
      if (![x, y, sz, sp, hue].every(isFinite)) continue;
      const g = { size: clamp(sz, 0.4, 2.6), speed: clamp(sp, 0.5, 1.5), hue: ((hue % 360) + 360) % 360 };
      const f = spawner(clamp(x, 10, W - 10), clamp(y, 14, H - 18), g, (gen | 0) || 1);
      if (f) { f.energy = clamp(e || 50, 1, 130); f.age = Math.max(0, age || 0);
        if (typeof nm === 'string' && nm) { f.name = nm; f.line = (typeof ln === 'string' && ln) ? ln : nm + '가'; } }
    }
  };
  unpackNew(d.shrimps, 'shrimp', SHRIMP_MAX, spawnShrimp);
  unpackNew(d.jellies, 'jelly', JELLY_MAX, spawnJelly);
  unpackNew(d.apexes, 'apex', APEX_MAX, spawnApex);
  /* 장식·사용자 수초·테마 복원 (v0.8) */
  for (const a of (d.decorations || [])) {
    if (!Array.isArray(a) || !isFinite(a[1])) continue;
    decorations.push({ kind: a[0] === 0 ? 'rock' : 'coral', x: clamp(a[1], 22, W - 22), y: H - 27, s: clamp(a[2] || 1, 0.5, 2), ph: rand(0, TAU) });
  }
  for (const a of (d.uplants || [])) {
    if (!Array.isArray(a) || !isFinite(a[0])) continue;
    plants.push({ x: clamp(a[0], 14, W - 14), blades: clamp(a[1] | 0 || 6, 3, 10), h: clamp(a[2] || 100, 30, H * 0.4), grow: 1, ph: rand(0, TAU), spore: rand(2, 6), user: true });
  }
  theme = clamp(d.theme | 0, 0, THEMES.length - 1);
  curTank.theme = theme;
  curTank.name = d.name || d.tankName || ((curTank.idx + 1) + '호 수조'); /* 수조 이름 복원 (v1.13) — 옛 저장은 기본 이름 */
  curTank.huntStyle = d.huntStyle === undefined ? 1 : clamp(d.huntStyle | 0, 0, 2); /* 사냥 성향 복원 (v1.14) */
}
function initWorld(d) {
  lineBook.clear();
  if (!d) {
    for (let i = 0; i < 130; i++) spawnAlgae();
    for (let i = 0; i < 26; i++) spawnHerb();
    for (let i = 0; i < 4; i++) spawnPred();
    for (let i = 0; i < 6; i++) spawnShrimp();
    for (let i = 0; i < 3; i++) spawnJelly();

  }

  waterway = d.waterway !== false; /* v1.9: 저장에 없으면 열림 (위임 기본) */
  for (const l of (d.logs || []).slice(-30)) if (l && typeof l.msg === 'string') logs.push({ d: l.d | 0, msg: String(l.msg).slice(0, 90) });
  for (const kv of (d.codex || [])) if (Array.isArray(kv) && kv[1] && kv[1].name) codex.set(kv[0], kv[1]);
  for (const kv of (d.ach || [])) if (Array.isArray(kv) && typeof kv[0] === 'string') ach[kv[0]] = kv[1] | 0;
  for (const c of (d.chronicle || [])) if (c && typeof c.msg === 'string') chronicle.push({ d: c.d | 0, msg: String(c.msg).slice(0, 120) });
  if (Array.isArray(d.dayMarks)) {
    storyState.dayMarks = new Set(d.dayMarks);
    storyState.genMarks = new Set(d.genMarks || []);
  } else {
    /* v9 이하 마이그레이션: 이미 지난 이정표는 기록 없이 조용히 채움 */
    storyState.dayMarks = new Set(DAY_MARKS.filter(m => env.day >= m));
    storyState.genMarks = new Set(GEN_MARKS.filter(m => Math.max(stats.maxGenHerb || 1, stats.maxGenPred || 1, stats.maxGenShrimp || 1, stats.maxGenJelly || 1, stats.maxGenApex || 1) >= m));
  }
  /* 혈통 계보 복원 — 없으면(v11 이하) 살아 있는 개체로 조용히 시드 */
  if (Array.isArray(d.lineBook)) {
    for (const e of d.lineBook) {

    for (const [kind, ko, arr] of [['herb', '초식어', herbs], ['pred', '포식자', preds], ['shrimp', '새우', shrimps], ['jelly', '해파리', jellies], ['apex', '대형 포식자', apexes]])
      for (const f of arr) {

        const key = kind + ':' + f.line;

        if (!e) { e = { kind, ko, line: f.line, founded: env.day, founder: null, births: 0, maxGen: f.gen, extinct: null }; lineBook.set(key, e); }

  try {

      makePlants();
      initTankData(d.tank2);
    }

}

/* 오프라인 정산: 떠나 있던 시간(최대 8시간)을 청크로 돌려 반영 — UI는 살아 있고 진행률 표시 */
const settleEl = document.getElementById('settle');
function startSettle(savedAt) {
  if (!isFinite(savedAt)) return;
  const elapsed = clamp((Date.now() - savedAt) / 1000, 0, 8 * 3600);
  if (elapsed < 120) return;
  const popH = () => tanks[0].herbs.length + tanks[1].herbs.length;
  const popP = () => tanks[0].preds.length + tanks[1].preds.length;
  const before = { day: tanks[0].env.day, h: popH(), p: popP(), dex: codex.size };
  const steps = Math.floor(elapsed / 0.25);
  let done = 0;
  settleEl.innerHTML = '<h3>자리를 비운 사이</h3>수족관의 시간을 따라잡는 중… <b id="settlePct">0%</b>';
  settleEl.classList.add('show');
  const pctEl = () => document.getElementById('settlePct');
  const CHUNK = tanks[1].open ? 2500 : 6000; /* 두 수조 정산은 절반씩 (v1.9) */
  settling = true;
  (function run() {
    const end = Math.min(done + CHUNK, steps);
    for (; done < end; done++) {
      bindTank(tanks[0]); step(0.25);
      if (tanks[1].open) { bindTank(tanks[1]); step(0.25); migrationTick(0.25); }
    }
    bindTank(tanks[viewTank]);
    if (done < steps) {
      if (pctEl()) pctEl().textContent = Math.round(done / steps * 100) + '%';
      setTimeout(run, 0);
      return;
    }
    settling = false;
    const after = { day: tanks[0].env.day, h: popH(), p: popP(), dex: codex.size };
    addLog('돌아오니 ' + (after.day - before.day) + '일이 지나 있었다');
    const hh = Math.floor(elapsed / 3600), mm = Math.floor((elapsed % 3600) / 60);
    settleEl.innerHTML = `<h3>자리를 비운 사이</h3>` +
      `${hh > 0 ? hh + '시간 ' : ''}${mm}분 동안 수족관은 계속 살아 있었습니다 (최대 8시간 정산)<br>` +
      `경과 <b>${before.day}일 → ${after.day}일</b> · ` +
      `초식어 <b>${before.h} → ${after.h}</b> · ` +
      `포식자 <b>${before.p} → ${after.p}</b> · ` +
      `도감 <b>${before.dex} → ${after.dex}종</b>` +
      `<button id="settleOk">확인</button>`;
    document.getElementById('settleOk').addEventListener('click', () => settleEl.classList.remove('show'));
  })();
}

/* ---------- 사운드 · 앰비언스 (v0.9, WebAudio 절차 생성 — 외부 에셋 없음) ---------- */
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  masterGain = actx.createGain();
  masterGain.gain.value = sndPref.muted ? 0 : sndPref.vol * 0.9;
  masterGain.connect(actx.destination);
  /* 브라운 노이즈 버퍼 — 물 소리의 원료 */
  const len = actx.sampleRate * 2;
  noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
  const ch = noiseBuf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; ch[i] = last * 3.4; }
  const mkLayer = freq => {
    const src = actx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq; f.Q.value = 0.5;
    const g = actx.createGain(); g.gain.value = 0;
    src.connect(f); f.connect(g); g.connect(masterGain);
    src.start();
    return { f, g };
  };
  dayLayer = mkLayer(820);   /* 낮: 밝은 물결 */
  nightLayer = mkLayer(300); /* 밤: 낮고 깊은 울림 */
  updateSndUI();
}
/* 낮밤 크로스페이드 + 간헐적 물방울·반짝임 — 700ms 간격, 프레임 루프와 무관 */
setInterval(() => {
  if (!actx || !masterGain) return;
  const t = actx.currentTime;
  dayLayer.g.gain.setTargetAtTime(env.light * 0.085 * (paused ? 0.3 : 1), t, 0.6);
  nightLayer.g.gain.setTargetAtTime((1 - env.light) * 0.10 * (paused ? 0.3 : 1), t, 0.6);
  dayLayer.f.frequency.setTargetAtTime(700 + env.light * 300 + Math.sin(env.t * 0.4) * 60, t, 0.8);
  if (!paused && Math.random() < (env.light > 0.4 ? 0.5 : 0.22)) blip(env.light > 0.4);
}, 700);
function blip(day) {
  if (!actx || sndPref.muted) return;
  const t0 = actx.currentTime;
  if (day) {
    /* 낮: 보글보글 물방울 */
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(rand(300, 700), t0);
    o.frequency.exponentialRampToValueAtTime(rand(700, 1400), t0 + 0.09);
    g.gain.setValueAtTime(0.028, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.12);
    o.connect(g); g.connect(masterGain);
    o.start(t0); o.stop(t0 + 0.13);
  } else {
    /* 밤: 드문드문한 고음 반짝임 */
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = rand(1500, 2400);
    g.gain.setValueAtTime(0.012, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
    o.connect(g); g.connect(masterGain);
    o.start(t0); o.stop(t0 + 0.52);
  }
}
function sfx(kind) {
  if (!actx || !masterGain || sndPref.muted) return;
  const t0 = actx.currentTime;
  if (kind === 'hunt') {
    /* 사냥: 낮은 어택 + 짧은 잡음 */
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(110, t0);
    o.frequency.exponentialRampToValueAtTime(46, t0 + 0.16);
    g.gain.setValueAtTime(0.16, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.2);
    o.connect(g); g.connect(masterGain);
    o.start(t0); o.stop(t0 + 0.22);
    const src = actx.createBufferSource(); src.buffer = noiseBuf;
    src.playbackRate.value = 1.6;
    const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 500;
    const g2 = actx.createGain();
    g2.gain.setValueAtTime(0.10, t0);
    g2.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.1);
    src.connect(f); f.connect(g2); g2.connect(masterGain);
    src.start(t0); src.stop(t0 + 0.12);
  } else if (kind === 'rare' || kind === 'legend') {
    /* 희귀·전설 발견: 맑은 차임 아르페지오 */
    const notes = kind === 'legend' ? [523, 659, 1046] : [660, 880];
    notes.forEach((fq, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = fq;
      const t1 = t0 + i * 0.11;
      g.gain.setValueAtTime(0.0001, t1);
      g.gain.exponentialRampToValueAtTime(0.07, t1 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t1 + 0.6);
      o.connect(g); g.connect(masterGain);
      o.start(t1); o.stop(t1 + 0.65);
    });
  } else if (kind === 'shutter') {
    /* 사진: 셔터 두 번의 짧은 클릭 */
    [0, 0.08].forEach(dt2 => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'square'; o.frequency.value = 1900;
      const t1 = t0 + dt2;
      g.gain.setValueAtTime(0.0001, t1);
      g.gain.exponentialRampToValueAtTime(0.07, t1 + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t1 + 0.05);
      o.connect(g); g.connect(masterGain);
      o.start(t1); o.stop(t1 + 0.06);
    });
  } else if (kind === 'achieve') {
    /* 업적: 금속성 팡파르 */
    [587, 740, 880].forEach((fq, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'triangle'; o.frequency.value = fq;
      const t1 = t0 + i * 0.09;
      g.gain.setValueAtTime(0.0001, t1);
      g.gain.exponentialRampToValueAtTime(0.09, t1 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t1 + 0.5);
      o.connect(g); g.connect(masterGain);
      o.start(t1); o.stop(t1 + 0.55);
    });
  } else if (kind === 'splash') {
    /* 먹이: 짧은 첨벙 */
    const src = actx.createBufferSource(); src.buffer = noiseBuf;
    src.playbackRate.value = 2.2;
    const f = actx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 900;
    const g = actx.createGain();
    g.gain.setValueAtTime(0.09, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.16);
    src.connect(f); f.connect(g); g.connect(masterGain);
    src.start(t0); src.stop(t0 + 0.18);
  }
}

function checkStory() {

      const k = kind + ':' + (f.line || '—');
      const e = cur.get(k) || { kind, ko, line: f.line || '—', n: 0, maxGen: 0 };
      e.n++; if (f.gen > e.maxGen) e.maxGen = f.gen;
      cur.set(k, e);

  }
  if (storyState.lines !== null)
    for (const [k, v] of storyState.lines)
      if (!cur.has(k)) {

      }
  storyState.lines = cur;

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function composePhoto(withCard, cb) {
  const w = canvas.width, h = canvas.height;
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  const c = out.getContext('2d');
  c.drawImage(canvas, 0, 0);
  if (withCard) {
    const u = DPR; /* 물리 픽셀 기준 스케일 */
    const ch = 92 * u, m = 12 * u, y = h - ch - m, x = m, cw = w - m * 2;
    c.fillStyle = 'rgba(6,18,30,.82)';
    c.strokeStyle = 'rgba(240,205,110,.5)';
    c.lineWidth = 1 * u;
    roundRect(c, x, y, cw, ch, 10 * u);
    c.fill(); c.stroke();
    c.textBaseline = 'alphabetic';
    c.fillStyle = '#f2d98a';
    c.font = '700 ' + (15 * u) + 'px sans-serif';
    c.fillText('푸른 순환 · 생태계 수족관', x + 12 * u, y + 22 * u);
    c.fillStyle = '#dceef8';
    c.font = (11 * u) + 'px sans-serif';
    c.fillText('생존 ' + env.day + '일째 · 도감 ' + codex.size + '종 · 업적 ' + Object.keys(ach).length + '/' + ACHIEVEMENTS.length,
      x + 12 * u, y + 44 * u);
    c.fillStyle = '#8fb4c8';
    c.font = (10 * u) + 'px sans-serif';
    const now = new Date();
    c.fillText('최고 세대 초식 ' + stats.maxGenHerb + ' · 포식 ' + stats.maxGenPred +
      ' · 조류 ' + algae.length + ' · ' + now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0'),
      x + 12 * u, y + 64 * u);
    c.fillText('방치해도 생태계가 저절로 돌아갑니다', x + 12 * u, y + 80 * u);
  }
  out.toBlob(b => cb(b), 'image/png');
}

/* ---------- 타임랩스 (v1.6) — 수족관의 나날을 짧은 영상으로 (MediaRecorder, 서버 불필요) ---------- */
const LAPSE_SEC = 15, LAPSE_SPEED = 8;
const lapseModalEl = document.getElementById('lapseModal');
const lapseVid = document.getElementById('lapseVid');
const lapseNote = document.getElementById('lapseNote');
const btnLapseDl = document.getElementById('btnLapseDl');
const btnLapseShare = document.getElementById('btnLapseShare');
let lapseRec = null, lapseChunks = [], lapseBlob = null, lapseURL = null, lapseName = '푸른순환-타임랩스.webm';
let lapsePrevSpeed = 1, lapseLeft = 0, lapseTimer = null, lapseMime = '';

function lapsePickMime() {
  const cands = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4'];
  for (const m of cands) { try { if (MediaRecorder.isTypeSupported(m)) return m; } catch (e) {} }
  return '';
}
function startLapse() {
  if (lapseRec || decoMode) return;
  const btnLapse = document.getElementById('btnLapse');
  if (!(window.MediaRecorder && canvas.captureStream)) {
    addLog('이 브라우저는 타임랩스 녹화를 지원하지 않는다');
    toast({ name: '타임랩스 미지원', desc: '이 브라우저는 canvas 녹화(MediaRecorder)를 지원하지 않습니다' });
    return;
  }
  const mime = lapsePickMime();
  if (!mime) {
    addLog('녹화 가능한 영상 형식이 없다');
    toast({ name: '타임랩스 미지원', desc: '녹화 가능한 영상 형식(webm/mp4)이 없습니다' });
    return;
  }
  try {
    lapseRec = new MediaRecorder(canvas.captureStream(30), { mimeType: mime, videoBitsPerSecond: 6000000 });
  } catch (e) {
    lapseRec = null;
    toast({ name: '타임랩스 시작 실패', desc: '녹화를 시작할 수 없습니다' });
    return;
  }
  lapseMime = mime;
  lapseChunks = [];
  lapseRec.ondataavailable = e => { if (e.data && e.data.size) lapseChunks.push(e.data); };
  lapseRec.onstop = finishLapse;
  lapsePrevSpeed = speed;
  speed = LAPSE_SPEED;
  btnSpeed.textContent = LAPSE_SPEED + '×'; btnSpeed.classList.add('on');
  lapseLeft = LAPSE_SEC;
  btnLapse.classList.add('rec');
  btnLapse.textContent = '⏺ ' + lapseLeft + '초';
  lapseRec.start(250);
  addLog('타임랩스 녹화 시작 — ' + LAPSE_SPEED + '배속으로 ' + LAPSE_SEC + '초');
  lapseTimer = setInterval(() => {
    lapseLeft--;
    if (lapseLeft <= 0) { stopLapse(); return; }
    document.getElementById('btnLapse').textContent = '⏺ ' + lapseLeft + '초';
  }, 1000);
}
function stopLapse() {
  if (!lapseRec) return;
  if (lapseTimer) { clearInterval(lapseTimer); lapseTimer = null; }
  try { lapseRec.stop(); } catch (e) { finishLapse(); }
}
function finishLapse() {
  lapseRec = null;
  speed = lapsePrevSpeed;
  btnSpeed.textContent = speed + '×'; btnSpeed.classList.toggle('on', speed > 1);
  const btnLapse = document.getElementById('btnLapse');
  btnLapse.classList.remove('rec'); btnLapse.textContent = '📹';
  const ext = lapseMime.indexOf('mp4') >= 0 ? 'mp4' : 'webm';
  lapseBlob = new Blob(lapseChunks, { type: lapseMime.split(';')[0] });
  lapseChunks = [];
  if (!lapseBlob.size) { addLog('타임랩스 저장에 실패했다'); return; }
  if (lapseURL) URL.revokeObjectURL(lapseURL);
  lapseURL = URL.createObjectURL(lapseBlob);
  lapseVid.src = lapseURL;
  lapseName = '푸른순환-타임랩스-' + env.day + '일.' + ext;
  lapseNote.textContent = LAPSE_SEC + '초 × ' + LAPSE_SPEED + '배속 · 약 ' + (LAPSE_SEC * LAPSE_SPEED / DAY_LEN).toFixed(1) + '일 분 · ' +
    ext.toUpperCase() + ' · ' + (lapseBlob.size / 1048576).toFixed(1) + 'MB';
  const file = new File([lapseBlob], lapseName, { type: lapseBlob.type });
  btnLapseShare.style.display = (navigator.canShare && navigator.canShare({ files: [file] })) ? '' : 'none';
  lapseModalEl.classList.add('show');
  addLog('수족관 타임랩스를 남겼다 (약 ' + (LAPSE_SEC * LAPSE_SPEED / DAY_LEN).toFixed(1) + '일 분)');
}
document.getElementById('btnLapse').addEventListener('click', () => { if (lapseRec) stopLapse(); else startLapse(); });
btnLapseDl.addEventListener('click', () => {
  if (!lapseURL) return;
  const a = document.createElement('a');
  a.href = lapseURL; a.download = lapseName;
  document.body.appendChild(a); a.click(); a.remove();
});
btnLapseShare.addEventListener('click', () => {
  if (!lapseBlob) return;
  const file = new File([lapseBlob], lapseName, { type: lapseBlob.type });
  navigator.share({ files: [file], title: '푸른 순환', text: '푸른 순환 ' + env.day + '일차 타임랩스' }).catch(() => {});
});

function moveFishToTank(f, toIdx) {
  const to = tanks[toIdx];
  if (!to || !to.open) return false;
  const CAPS = { herbs: HERB_MAX, preds: PRED_MAX, shrimps: SHRIMP_MAX, jellies: JELLY_MAX, apexes: APEX_MAX };
  for (const arrName in CAPS) {
    const arr = curTank[arrName];
    const i = arr.indexOf(f);
    if (i < 0) continue;
    if (to[arrName].length >= CAPS[arrName]) { addLog(to.name + '이 가득 차 옮길 수 없다'); return false; }
    arr.splice(i, 1);
    f.x = rand(30, W - 30); f.y = rand(H * 0.2, H * 0.7); f.vx = rand(-20, 20); f.vy = rand(-10, 10);
    to[arrName].push(f);
    stats.migrations = (stats.migrations || 0) + 1;
    addLog((f.name || '개체') + '을(를) ' + to.name + '로 옮겼다');
    addChron('🔀 ' + (f.name || '—') + ' — ' + curTank.name + '에서 ' + to.name + '로 이주');
    return true;
  }
  return false;
}
/* 연결 수로: 붐비는 쪽에서 반나절에 한 번꼴로 한 마리가 알아서 건너감 — 개입 불필요 (위임 기본 ON) */
function migrationTick(sdt) {
  if (!tanks[1].open || !waterway) return;
  migAcc += sdt;
  if (migAcc < DAY_LEN * 0.5) return;
  migAcc = 0;
  const cnt = tk => tk.herbs.length + tk.preds.length + tk.shrimps.length + tk.jellies.length + tk.apexes.length;
  const c0 = cnt(tanks[0]), c1 = cnt(tanks[1]);
  if (c0 === c1 && Math.random() < 0.5) return; /* 비슷하면 가끔 쉼 */
  const from = c0 >= c1 ? tanks[0] : tanks[1];
  const to = from === tanks[0] ? tanks[1] : tanks[0];
  if (to.env.oxygen < 0.26) return; /* 저산소 수조로는 보내지 않음 (v1.11) */
  /* [배열, 종 한글, 최소 잔여, 상한] — 원천 수조에 최소 수는 남김 */
  const KINDS = [['herbs', '초식어', 5, HERB_MAX], ['preds', '포식자', 2, PRED_MAX], ['shrimps', '새우', 3, SHRIMP_MAX], ['jellies', '해파리', 2, JELLY_MAX], ['apexes', '대형 포식자', 1, APEX_MAX]];
  const cands = KINDS.filter(([a, , floor, cap]) => from[a].length > floor && to[a].length < cap);
  if (!cands.length) return;
  const [arrName, ko] = cands[(Math.random() * cands.length) | 0];
  const f = from[arrName][(Math.random() * from[arrName].length) | 0];
  from[arrName].splice(from[arrName].indexOf(f), 1);
  f.x = rand(30, W - 30); f.y = rand(H * 0.2, H * 0.7); f.vx = rand(-20, 20); f.vy = rand(-10, 10);
  to[arrName].push(f);
  stats.migrations = (stats.migrations || 0) + 1;
  addLog(ko + ' ' + (f.name || '') + '이(가) 연결 수로를 통해 ' + to.name + '로 건너갔다');
  addChron('🔀 ' + ko + ' ' + (f.name || '—') + ' — ' + from.name + '에서 ' + to.name + '로 이주');
}

/* ============================================================
   시뮬레이션 스텝
   ============================================================ */
function step(dt) {
  env.t += dt;
  env.day = Math.floor(env.t / DAY_LEN);

  /* --- 계절 · 장기 이벤트 (v1.4) --- */
  const sm = seasonMods();
  const _si = seasonIdx(env.day);
  if (env.seasonLast < 0) env.seasonLast = _si;
  else if (_si !== env.seasonLast) {
    env.seasonLast = _si;
    if (!settling && curTank.idx === 0) {
      const s = SEASONS[_si];
      addLog(s.name + '이 왔다 — ' + s.label);
      addChron(s.icon + ' ' + s.name + ' · ' + s.label);
    }
  }
  if (env.seasonEv && env.day >= env.seasonEv.until) {
    const E = SEASON_EVENTS[env.seasonEv.id];
    env.seasonEv = null;
    if (E && !settling && curTank.idx === 0) { addLog(E.endMsg); addChron(E.icon + ' ' + E.endMsg); }
  } else if (!env.seasonEv && !restoring && !settling && curTank.idx === 0) {
    for (const id in SEASON_EVENTS) {
      const E = SEASON_EVENTS[id];
      if (E.seasons.indexOf(_si) >= 0 && Math.random() < dt * 0.0016) {
        env.seasonEv = { id, until: env.day + 2 + ((Math.random() * 2) | 0) };
        tanks[1].env.seasonEv = { id, until: env.seasonEv.until }; /* 계절 이벤트는 두 수조가 함께 겪음 (v1.9) */
        addLog(E.startMsg);
        addChron(E.icon + ' ' + E.startMsg);
        break;
      }
    }
  }

  /* --- 환경: 낮밤 · 수온 · 용존 산소 (v0.4) --- */
  env.light = daylight(env.t);
  const seasonDrift = Math.sin(env.t / 240) * 1.5;                 // 아주 느린 계절 변동
  const tempTarget = 17.5 + env.light * 8 + (env.bloom > 0 ? 2 : 0) + seasonDrift + sm.tempAdd;
  env.temp += (tempTarget - env.temp) * clamp(dt * 0.03, 0, 1);
  /* 산소: 낮에 조류·수초 광합성으로 생산, 물고기 호흡으로 소비, 대기 평형으로 확산 */
  const oProd = (env.light * (algae.length / ALGAE_MAX) * 0.05 + env.light * plants.length * 0.0016) * sm.oxy;
  const oCons = (herbs.length * 0.0004 + preds.length * 0.0018) * (1 + (env.temp - 22) * 0.03);
  env.oxygen = clamp(env.oxygen + dt * (oProd - oCons + (0.62 - env.oxygen) * 0.036), 0, 1); /* 대기 확산 완충 강화 (v1.13) */
  if (env.oxygen < 0.24 && !env.oxyWarned) { env.oxyWarned = true; addLog('용존 산소가 낮아지고 있다'); }
  if (env.oxygen > 0.38) env.oxyWarned = false;

  /* --- 수초: 영양염 소모해 성장, 낮에만 포자(조류) 방출 --- */
  for (const p of plants) {
    p.grow = clamp(p.grow + dt * 0.02 * env.nutrients * (0.3 + env.light * 0.7), 0.3, 1);
    p.spore -= dt;
    if (p.spore <= 0) {
      p.spore = rand(2.5, 6) / (0.25 + env.nutrients * (0.15 + env.light * 0.85));
      if (env.light > 0.2 || Math.random() < 0.2) spawnAlgae(p.x + rand(-14, 14), H - p.h * p.grow - rand(0, 30));
    }
  }
  /* 영양염은 서서히 소모 */
  env.nutrients = clamp(env.nutrients - dt * 0.004, 0, 1);
  /* 부유 조류 자연 발생 — 낮 광합성에 비례, 밤에는 잔량만 */
  if (algae.length < ALGAE_MAX && Math.random() < dt * (0.3 + env.light * 3.2) * (0.35 + env.nutrients) * sm.algae) spawnAlgae();

  /* --- 조류 대발생 이벤트 (영양염 풍부 + 한낮) --- */
  if (env.bloomCd > 0) env.bloomCd -= dt;
  if (env.bloom > 0) {
    env.bloom -= dt;
    for (let k = 0; k < 2; k++) if (algae.length < ALGAE_MAX && Math.random() < dt * 9) spawnAlgae(rand(10, W - 10), rand(10, H * 0.7));
    if (env.bloom <= 0) {
      env.bloomCd = 75;
      /* 대발생 종료: 일부 조류가 죽어 영양염으로 — 산소 급감 유발 */
      const die = Math.floor(algae.length * 0.35);
      for (let k = 0; k < die; k++) { const a = algae.splice((Math.random() * algae.length) | 0, 1)[0]; if (a) dropDetritus(a.x, a.y, 0.8); }
      env.oxygen = clamp(env.oxygen - 0.12, 0, 1);
      addLog('조류 대발생이 가라앉았다');
    }
  } else if (env.bloomCd <= 0 && env.nutrients > 0.5 && env.light > 0.7 && algae.length > 60 && Math.random() < dt * 0.012) {
    env.bloom = 13;
    addLog('조류가 대발생하기 시작했다');
    stats.bloomsSeen = (stats.bloomsSeen || 0) + 1;
  }

  /* --- 조류 이동 --- */
  algaeGrid.clear();
  for (let i = algae.length - 1; i >= 0; i--) {
    const a = algae[i];
    a.ph += dt;
    a.x += (a.vx + Math.sin(a.ph * 0.8) * 6) * dt;
    a.y += (a.vy + Math.cos(a.ph * 0.6) * 4) * dt;
    if (a.x < 4) a.x = 4, a.vx = Math.abs(a.vx);
    if (a.x > W - 4) a.x = W - 4, a.vx = -Math.abs(a.vx);
    if (a.y < 4) a.y = 4, a.vy = Math.abs(a.vy);
    if (a.y > H - 8) a.y = H - 8, a.vy = -Math.abs(a.vy);
    algaeGrid.add(a);
  }

  /* --- 찌꺼기: 가라앉아 영양염으로 --- */
  for (let i = detritus.length - 1; i >= 0; i--) {
    const d = detritus[i];
    d.y += d.vy * dt;
    if (d.y > H - 6) {
      env.nutrients = clamp(env.nutrients + d.amt * 0.004, 0, 1);
      detritus.splice(i, 1);
    }
  }

  /* --- 고기 먹이 · 플랑크톤 (v1.8) --- */
  for (let i = meatPellets.length - 1; i >= 0; i--) {
    const m = meatPellets[i];
    m.y += m.vy * dt; m.x += m.vx * dt; m.ph += dt * 2;
    m.vx *= (1 - clamp(dt * 0.6, 0, 0.4));
    if (m.y > H - 8) { dropDetritus(m.x, H - 10, 1.0); meatPellets.splice(i, 1); } /* 못 먹으면 바닥에서 순환 */
  }
  for (let i = planktons.length - 1; i >= 0; i--) {
    const p = planktons[i];
    p.x += p.vx * dt + Math.sin(p.ph) * 0.12; p.y += p.vy * dt; p.ph += dt; p.life -= dt;
    if (p.x < 6) { p.x = 6; p.vx = Math.abs(p.vx); } if (p.x > W - 6) { p.x = W - 6; p.vx = -Math.abs(p.vx); }
    if (p.y < 10) { p.y = 10; p.vy = Math.abs(p.vy); } if (p.y > H * 0.8) { p.y = H * 0.8; p.vy = -Math.abs(p.vy); }
    if (p.life <= 0) planktons.splice(i, 1);
  }

  /* --- 먹이 버프 · 자동 먹이 위임 (v1.8) --- */
  for (const k in feedBuff) feedBuff[k] = Math.max(0, feedBuff[k] - dt);
  for (const k in autoFeedCd) autoFeedCd[k] = Math.max(0, autoFeedCd[k] - dt);
  env.autoTick = (env.autoTick || 0) + dt;
  if (autoFeed && !restoring && !settling && env.autoTick >= DAY_LEN * 0.25) { env.autoTick = 0; autoFeedEval(); }

  /* --- 초식어 --- */
  herbGrid.clear();
  for (const h of herbs) herbGrid.add(h);
  for (let i = herbs.length - 1; i >= 0; i--) {
    const f = herbs[i];
    f.age += dt;
    const g = f.genes;
    const spd = 42 * g.speed;
    const hungry = f.energy < 68;

    // 포식자 회피
    let fleeX = 0, fleeY = 0, danger = false;
    for (const p of preds) {
      const dx = f.x - p.x, dy = f.y - p.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < 120 * 120) { danger = true; const d = Math.sqrt(d2) || 1; fleeX += dx / d; fleeY += dy / d; }
    }

    let ax = 0, ay = 0;
    if (danger) {
      ax = fleeX * spd * 2.6; ay = fleeY * spd * 2.6;
    } else if (hungry) {
      // 가장 가까운 조류 탐색
      let best = null, bd = 1e9;
      algaeGrid.near(f.x, f.y, 130, _near);
      for (const a of _near) {
        const dx = a.x - f.x, dy = a.y - f.y, d2 = dx * dx + dy * dy;
        if (d2 < bd) { bd = d2; best = a; }
      }
      if (best) {
        const d = Math.sqrt(bd) || 1;
        ax = (best.x - f.x) / d * spd; ay = (best.y - f.y) / d * spd;
        if (d < 9 * g.size + best.r) {
          f.energy = clamp(f.energy + best.e, 0, 100);
          const ai = algae.indexOf(best);
          if (ai >= 0) algae.splice(ai, 1);
          if (Math.random() < 0.3) spawnBubble(f.x, f.y);
        }
      } else {
        ax = Math.cos(f.wobble) * spd * 0.5; ay = Math.sin(f.wobble * 0.7) * spd * 0.35;
      }
    } else {
      // 느긋한 유영 + 약한 군집
      ax = Math.cos(f.wobble) * spd * 0.4; ay = Math.sin(f.wobble * 0.8) * spd * 0.3;
      herbGrid.near(f.x, f.y, 56, _near);
      let cx = 0, cy = 0, n = 0;
      for (const o of _near) { if (o !== f) { cx += o.vx; cy += o.vy; n++; } }
      if (n > 0) { ax += (cx / n) * 0.35; ay += (cy / n) * 0.35; }
    }
    f.wobble += dt * rand(0.4, 1.1);

    f.vx += (ax - f.vx) * clamp(dt * 2.4, 0, 1);
    f.vy += (ay - f.vy) * clamp(dt * 2.4, 0, 1);
    f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.x < 12) f.x = 12, f.vx = Math.abs(f.vx);
    if (f.x > W - 12) f.x = W - 12, f.vx = -Math.abs(f.vx);
    if (f.y < 14) f.y = 14, f.vy = Math.abs(f.vy);
    if (f.y > H - 22) f.y = H - 22, f.vy = -Math.abs(f.vy);

    f.energy -= dt * (1.85 + g.speed * 0.75) * (1 + (env.temp - 22) * 0.04) / (0.65 + env.oxygen * 0.55) * sm.meta;
    f.dir = f.vx >= 0 ? 1 : -1;

    // 번식 — 산소가 낮을수록 번식 상한을 낮춰 과밀·산소 붕괴를 막는다 (v1.11)
    const herbCap = env.oxygen > 0.34 ? 42 : (env.oxygen > 0.24 ? 30 : 18);
    if (f.energy > 76 * sm.breed * (feedBuff.herb > 0 ? 0.88 : 1) && f.age > 12 && herbs.length < herbCap) {
      f.energy *= 0.55;
      const ng = mutate(g, 1);
      const child = spawnHerb(f.x + rand(-8, 8), f.y + rand(-8, 8), ng, f.gen + 1, f.line);
      if (child) {
        stats.births++; curTank.st.births++;
        if (child.rar >= 2 && child.newMorph) addChron(f.line + ' — ' + (child.rar === 3 ? '전설의' : '희귀한') + ' 변이 ' + child.name + ' 탄생 (' + (f.gen + 1) + '대)');
        if (f.gen + 1 > stats.maxGenHerb) { stats.maxGenHerb = f.gen + 1; if (stats.maxGenHerb >= 3) addLog('초식어 ' + stats.maxGenHerb + '세대 등장'); }
        if (Math.abs(ng.hue - g.hue) > 10) { stats.mutations++; if (stats.mutations <= 3 || stats.mutations % 10 === 0) addLog('새로운 색의 변이 출현 (누적 ' + stats.mutations + ')'); }
      }
      if (child && !firstBreedLogged) { firstBreedLogged = true; addLog('초식어 2세대가 태어났다'); }
    }
    // 죽음
    if (f.energy <= 0 || f.age > 150) {
      if (f.energy <= 0) stats.herbStarve = (stats.herbStarve || 0) + 1; else stats.herbAge = (stats.herbAge || 0) + 1;
      dropDetritus(f.x, f.y, 3.2);
      stats.deaths++; curTank.st.deaths++;
      herbs.splice(i, 1);
      if (!firstDeathLogged) { firstDeathLogged = true; addLog('죽은 개체가 영양염으로 돌아갔다'); }
    }
  }

  /* --- 포식자 --- */
  for (let i = preds.length - 1; i >= 0; i--) {
    const f = preds[i];
    f.age += dt;
    const g = f.genes;
    const spd = 52 * g.speed;
    let ax, ay;
    let best = null, bd = 1e9;
    const huntDrive = herbs.length < 8 ? 45 : Math.round(88 * (HUNT_STYLE_MUL[curTank.huntStyle] || 1)); // 먹이가 귀하면 사냥을 자제 — 회복 기회 · 수조별 사냥 성향 반영 (v1.14)

    if (f.energy < huntDrive && !mp) {

    } else if (best) {

    } else if (f.energy < 60 && shrimps.length > 0) {

    f.dir = f.vx >= 0 ? 1 : -1;

    if (f.energy > 98 * sm.breed * (feedBuff.pred > 0 ? 0.88 : 1) && f.age > 30 && preds.length < PRED_MAX) {
      f.energy *= 0.55;
      const ng = mutate(g, 1);

      if (child) {

  }

  /* --- 새우: 찌꺼기를 주워 먹는 청소부 (v0.7) --- */
  for (let i = shrimps.length - 1; i >= 0; i--) {
    const f = shrimps[i];
    f.age += dt;
    const g = f.genes;
    const spd = 46 * g.speed;
    let ax = 0, ay = 0;
    let best = null, bd = 1e9;
    for (const dtr of detritus) {
      const dx = dtr.x - f.x, dy = dtr.y - f.y, d2 = dx * dx + dy * dy;
      if (d2 < bd) { bd = d2; best = dtr; }
    }
    if (best && bd < 170 * 170) {
      const d = Math.sqrt(bd) || 1;
      ax = (best.x - f.x) / d * spd; ay = (best.y - f.y) / d * spd;
      if (d < 8) {
        f.energy = clamp(f.energy + best.amt * 8, 0, 100);
        env.nutrients = clamp(env.nutrients + best.amt * 0.0026, 0, 1); // 소화 후 즉시 순환 (자연 분해 이상)

      }
    } else if (f.energy < 30) {
      /* 찌꺼기가 없고 많이 굶주리면 조류를 쪼아 먹음 */
      let ba = null, bad = 1e9;
      algaeGrid.near(f.x, f.y, 90, _near);
      for (const a of _near) {
        const dx = a.x - f.x, dy = a.y - f.y, d2 = dx * dx + dy * dy;
        if (d2 < bad) { bad = d2; ba = a; }
      }

        const d = Math.sqrt(bad) || 1;
        ax = (ba.x - f.x) / d * spd * 0.8; ay = (ba.y - f.y) / d * spd * 0.8;
        if (d < 7 * g.size + ba.r) {

          const ai = algae.indexOf(ba);
          if (ai >= 0) algae.splice(ai, 1);
        }
      } else {
        ax = Math.cos(f.wobble) * spd * 0.4; ay = Math.sin(f.wobble * 0.7) * spd * 0.25;
      }
    } else {

    }
    f.wobble += dt * rand(0.5, 1.2);
    f.vx += (ax - f.vx) * clamp(dt * 2.6, 0, 1);
    f.vy += (ay - f.vy) * clamp(dt * 2.6, 0, 1);
    f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.x < 10) f.x = 10, f.vx = Math.abs(f.vx);
    if (f.x > W - 10) f.x = W - 10, f.vx = -Math.abs(f.vx);
    if (f.y < H * 0.45) f.y = H * 0.45, f.vy = Math.abs(f.vy); // 바닥권 서식
    if (f.y > H - 18) f.y = H - 18, f.vy = -Math.abs(f.vy);
    f.energy -= dt * (1.2 + g.speed * 0.5) * (1 + (env.temp - 22) * 0.04) / (0.65 + env.oxygen * 0.55) * sm.meta;

  }

  /* --- 해파리: 부유하며 조류를 흡수 (v0.7) --- */
  for (let i = jellies.length - 1; i >= 0; i--) {
