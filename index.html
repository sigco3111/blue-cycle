        if (Math.abs(ng.hue - g.hue) > 10) stats.mutations++;
      }
    }
    if (f.energy <= 0 || f.age > 600) {
      dropDetritus(f.x, f.y, 12);
      stats.deaths++; curTank.st.deaths++;
      apexes.splice(i, 1);
      addLog('대형 포식자가 숨을 거두었다');
    }
  }

  /* --- 기포 --- */
  if (Math.random() < dt * 2.5) spawnBubble(rand(0, W), H - 10);
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    b.y -= b.vy * dt;
    b.x += Math.sin(b.drift + b.y * 0.02) * 8 * dt;
    if (b.y < -6) bubbles.splice(i, 1);
  }

  /* --- 이력 샘플링 --- */
  curTank.histAcc += dt;
  if (curTank.histAcc >= 0.5) {
    curTank.histAcc = 0;
    hist.a.push(algae.length); hist.h.push(herbs.length); hist.p.push(preds.length);
    hist.s.push(shrimps.length); hist.j.push(jellies.length); hist.x.push(apexes.length);
    hist.o.push(Math.round(env.oxygen * 100)); hist.tp.push(Math.round(env.temp * 10) / 10);
    if (hist.a.length > HIST_MAX) { hist.a.shift(); hist.h.shift(); hist.p.shift(); hist.s.shift(); hist.j.shift(); hist.x.shift(); hist.o.shift(); hist.tp.shift(); }
  }

  /* --- 멸종과 회복 이벤트 (v0.4) --- */
  if (herbs.length === 0) {
    if (!env.herbGone) { env.herbGone = true; env.herbRescue = 18; addLog('초식어가 모두 사라졌다'); }
    /* 포식 압력이 낮아질 때까지 기다렸다가 유입 — 유입 개체가 곧바로 먹히는 악순환 방지 */
    if (env.herbRescue > 0 && algae.length > 60) {
      if (preds.length <= 4) {
        env.herbRescue -= dt;
        if (env.herbRescue <= 0) {
          const rf = spawnHerb(); spawnHerb(); spawnHerb();
          env.herbGone = false;
          if (rf) addChron(rf.line + ' 정착 — 초식어 ' + rf.name + '의 무리가 흘러들었다');
          addLog('어디선가 초식어 무리가 흘러들었다');
          stats.recoveries = (stats.recoveries || 0) + 1;
        }
      }
    }
  } else env.herbGone = false;
  if (preds.length === 0) {
    if (!env.predGone) { env.predGone = true; addLog('포식자가 모두 사라졌다'); }
    if (env.predRescue < 0 && herbs.length > 12) env.predRescue = 20;
    if (env.predRescue >= 0) {
      env.predRescue -= dt;
      if (env.predRescue < 0) { const rf = spawnPred(); env.predGone = false; addLog('어디선가 포식자가 흘러들었다'); stats.recoveries = (stats.recoveries || 0) + 1; if (rf) addChron(rf.line + ' 정착 — 포식자 ' + rf.name + '의 유입'); }
    }
  } else { env.predGone = false; env.predRescue = -1; }
  /* 새우·해파리·대형 포식자 회복 (v0.7) */
  if (shrimps.length === 0 && detritus.length + algae.length > 40) {
    if (!env.shrimpGone) { env.shrimpGone = true; }
    if (Math.random() < dt * 0.05) { const rf = spawnShrimp(); spawnShrimp(); env.shrimpGone = false; addLog('바닥에서 새우 한 쌍이 기어 나왔다'); stats.recoveries = (stats.recoveries || 0) + 1; if (rf) addChron(rf.line + ' 정착 — 새우 ' + rf.name + '의 한 쌍'); }
  }
  if (jellies.length === 0 && Math.random() < dt * 0.02) {
    const rf = spawnJelly();
    if (rf) addChron(rf.line + ' 정착 — 해파리 ' + rf.name + '의 유입');
    addLog('해파리가 물결을 타고 흘러들었다');
    stats.recoveries = (stats.recoveries || 0) + 1;
  }
  if (apexes.length === 0 && preds.length >= 3) {
    if (env.apexRescue === undefined || env.apexRescue < 0) env.apexRescue = 60;
    env.apexRescue -= dt;
    if (env.apexRescue < 0) { const rf = spawnApex(); addLog('그림자 같은 대형 포식자가 나타났다'); stats.recoveries = (stats.recoveries || 0) + 1; if (rf) addChron(rf.line + ' 정착 — 대형 포식자 ' + rf.name + '의 출현'); }
  } else if (apexes.length > 0) env.apexRescue = -1;
}

/* ============================================================
   렌더링 (v0.2 — 척추 곡선 물고기, 수면, 빛줄기, 깊이색)
   ============================================================ */
/* 수면 반짝임 입자 */
const glints = [];
for (let i = 0; i < 14; i++) glints.push({ x: Math.random(), y: rand(4, 22), w: rand(14, 46), ph: rand(0, TAU), sp: rand(0.008, 0.03) });
/* 플랑크톤 입자 */
const motes = [];
for (let i = 0; i < 70; i++) motes.push({ x: Math.random(), y: Math.random(), r: rand(0.5, 1.6), ph: rand(0, TAU), sp: rand(0.5, 2) });

function drawBackground(t) {
  const TH = THEMES[theme];
  const grd = ctx.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, TH.bg[0]);
  grd.addColorStop(0.4, TH.bg[1]);
  grd.addColorStop(0.75, TH.bg[2]);
  grd.addColorStop(1, TH.bg[3]);
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  /* 빛줄기 — 깜빡임과 표류 */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 5; i++) {
    const drift = Math.sin(t * 0.07 + i * 1.7) * 60 + Math.sin(t * 0.023 + i * 3.1) * 30;
    const bx = W * (0.08 + i * 0.21) + drift;
    const flick = (0.6 + 0.4 * Math.sin(t * 0.5 + i * 2.2)) * (0.12 + env.light * 0.88);
    const g2 = ctx.createLinearGradient(bx, 0, bx + 100, H * 0.9);
    g2.addColorStop(0, `rgba(${TH.ray},${0.10 * flick})`);
    g2.addColorStop(0.6, `rgba(${TH.ray},${0.035 * flick})`);
    g2.addColorStop(1, `rgba(${TH.ray},0)`);
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.moveTo(bx - 22, 0); ctx.lineTo(bx + 22, 0);
    ctx.lineTo(bx + 150, H * 0.9); ctx.lineTo(bx - 20, H * 0.9);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();

  /* 플랑크톤 */
  for (const m of motes) {
    const my = ((m.y * H + t * m.sp * 3) % H);
    const tw = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(t * 1.3 + m.ph));
    const depth = my / H;
    ctx.fillStyle = `rgba(${TH.mote},${tw * (1 - depth * 0.55)})`;
    ctx.beginPath();
    ctx.arc((m.x * W + Math.sin(t * 0.3 + m.ph) * 12), my, m.r, 0, TAU);
    ctx.fill();
  }

  /* 바닥 */
  const sand = ctx.createLinearGradient(0, H - 60, 0, H);
  sand.addColorStop(0, TH.sand[0]); sand.addColorStop(0.5, TH.sand[1]); sand.addColorStop(1, TH.sand[2]);
  ctx.fillStyle = sand;
  ctx.beginPath();
  ctx.moveTo(0, H - 30);
  for (let x = 0; x <= W; x += 40) ctx.lineTo(x, H - 30 + Math.sin(x * 0.015 + 2) * 7);
  ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath(); ctx.fill();

  /* 바닥 코스틱스 (빛 얼룩) */
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 6; i++) {
    const cx = (i * 0.19 + 0.06) * W + Math.sin(t * 0.35 + i * 2.4) * 26;
    const cy = H - 18 - Math.abs(Math.sin(t * 0.28 + i)) * 14;
    const rr = 26 + Math.sin(t * 0.5 + i * 1.3) * 9;
    const cg = ctx.createRadialGradient(cx, cy, 0, cx, cy, rr);
    cg.addColorStop(0, `rgba(${TH.caustic},0.10)`);
    cg.addColorStop(1, `rgba(${TH.caustic},0)`);
    ctx.fillStyle = cg;
    ctx.beginPath(); ctx.arc(cx, cy, rr, 0, TAU); ctx.fill();
  }
  ctx.restore();

  /* 수면 — 파도 밴드 + 반짝임 */
  const surf = ctx.createLinearGradient(0, 0, 0, 34);
  surf.addColorStop(0, `rgba(${TH.surf},0.28)`);
  surf.addColorStop(1, `rgba(${TH.surf},0)`);
  ctx.fillStyle = surf;
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(W, 0); ctx.lineTo(W, 10);
  for (let x = W; x >= 0; x -= 24) ctx.lineTo(x, 10 + Math.sin(x * 0.03 + t * 1.4) * 3.5 + Math.sin(x * 0.011 - t * 0.7) * 3);
  ctx.lineTo(0, 0); ctx.closePath(); ctx.fill();

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const gl of glints) {
    const gx = ((gl.x + t * gl.sp) % 1) * W;
    const a = 0.10 + 0.16 * (0.5 + 0.5 * Math.sin(t * 2 + gl.ph));
    ctx.fillStyle = `rgba(200,235,255,${a})`;
    ctx.beginPath();
    ctx.ellipse(gx, gl.y, gl.w * 0.5, 1.4, 0, 0, TAU);
    ctx.fill();
  }
  ctx.restore();

  /* 비네트 */
  const vg = ctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.45, W / 2, H * 0.55, Math.max(W, H) * 0.95);
  vg.addColorStop(0, 'rgba(0,10,20,0)');
  vg.addColorStop(1, 'rgba(0,8,16,0.42)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);
}

function drawPlants(t) {
  for (const p of plants) {
    const hMax = p.h * p.grow;
    const depth = 0.85;
    for (let b = 0; b < p.blades; b++) {
      const off = (b - p.blades / 2) * 5;
      const sway = Math.sin(t * 0.9 + p.ph + b * 0.7) * (6 + b);
      const bh = hMax * (0.6 + 0.4 * ((b * 37 % 10) / 10));
      const g = ctx.createLinearGradient(p.x, H, p.x, H - bh);
      g.addColorStop(0, `rgba(24,80,54,${depth})`);
      g.addColorStop(0.7, `rgba(58,160,96,${depth})`);
      g.addColorStop(1, `rgba(110,220,140,${depth * 0.92})`);
      ctx.strokeStyle = g;
      ctx.lineWidth = 2.6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p.x + off * 0.4, H - 24);
      ctx.quadraticCurveTo(p.x + off + sway * 0.4, H - 24 - bh * 0.6, p.x + off + sway, H - 24 - bh);
      ctx.stroke();
      /* 잎 끝 물방울 반사 */
      if (b % 3 === 0) {
        ctx.fillStyle = 'rgba(170,240,190,0.35)';
        ctx.beginPath(); ctx.arc(p.x + off + sway, H - 24 - bh, 1.3, 0, TAU); ctx.fill();
      }
    }
  }
}

function drawDecorations(t) {
  for (const d of decorations) {
    const s = d.s;
    if (d.kind === 'rock') {
      /* 바위: 겹친 회갈색 덩어리 */
      for (let i = 0; i < 3; i++) {
        const rx = d.x + Math.cos(d.ph + i * 2.1) * 9 * s;
        const ry = d.y - 4 - Math.abs(Math.sin(d.ph + i * 1.4)) * 7 * s;
        const rr = (13 - i * 3) * s;
        const g = ctx.createLinearGradient(rx, ry - rr, rx, ry + rr);
        g.addColorStop(0, '#5a6a74'); g.addColorStop(0.6, '#3d4a52'); g.addColorStop(1, '#242e34');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.ellipse(rx, ry, rr, rr * 0.78, 0, 0, TAU); ctx.fill();
      }
      /* 윗면 하이라이트 */
      ctx.fillStyle = 'rgba(190,215,225,0.18)';
      ctx.beginPath(); ctx.ellipse(d.x - 3 * s, d.y - 12 * s, 8 * s, 4 * s, -0.3, 0, TAU); ctx.fill();
    } else {
      /* 산호: 갈라지는 가지 — ph로 결정적 생성 */
      const hue = 340 + (d.ph / TAU) * 30; /* 분홍~주황 */
      const branches = (t2, bx, by, ang, len, w, depth) => {
        if (depth <= 0 || len < 3) return;
        const ex = bx + Math.cos(ang) * len, ey = by + Math.sin(ang) * len;
        ctx.strokeStyle = `hsla(${hue},62%,${52 + depth * 6}%,0.92)`;
        ctx.lineWidth = w; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(ex, ey); ctx.stroke();
        ctx.fillStyle = `hsla(${hue},70%,68%,0.95)`;
        ctx.beginPath(); ctx.arc(ex, ey, w * 0.7, 0, TAU); ctx.fill();
        const n = depth === 3 ? 3 : 2;
        for (let k = 0; k < n; k++) {
          const spread = Math.sin(d.ph * 7 + t2 * 13 + k * 5) * 0.55;
          branches(t2 + 1 + k, ex, ey, ang + spread + (k - (n - 1) / 2) * 0.5, len * 0.68, w * 0.72, depth - 1);
        }
      };
      const sway = Math.sin(t * 0.7 + d.ph) * 0.04;
      branches(0, d.x, d.y + 4, -Math.PI / 2 + sway, 26 * s, 4.5 * s, 3);
    }
  }
}
function drawAlgae(t) {
  for (const a of algae) {
    const depth = clamp(a.y / H, 0, 1);
    const pulse = 1 + Math.sin(t * 2 + a.ph) * 0.12;
    ctx.fillStyle = `rgba(${105 - depth * 30 | 0},${214 - depth * 50 | 0},${124 - depth * 20 | 0},${0.88 - depth * 0.18})`;
    ctx.beginPath();
    ctx.arc(a.x, a.y, a.r * pulse, 0, TAU);
    ctx.fill();
    ctx.fillStyle = `rgba(190,255,200,${0.5 - depth * 0.25})`;
    ctx.beginPath();
    ctx.arc(a.x - a.r * 0.25, a.y - a.r * 0.3, a.r * 0.42 * pulse, 0, TAU);
    ctx.fill();
  }
}

function drawDetritus() {
  ctx.fillStyle = 'rgba(160,140,110,0.5)';
  for (const d of detritus) {
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, TAU); ctx.fill();
  }
}
function drawFeedPellets(t) { /* v1.8: 고기 먹이 · 플랑크톤 */
  for (const m of meatPellets) {
    const wob = Math.sin(t * 3 + m.ph) * 0.15;
    ctx.fillStyle = 'rgba(196,110,84,0.92)';
    ctx.beginPath(); ctx.ellipse(m.x, m.y, m.r * (1 + wob), m.r * 0.82 * (1 - wob * 0.5), 0, 0, TAU); ctx.fill();
    ctx.fillStyle = 'rgba(255,190,150,0.5)';
    ctx.beginPath(); ctx.arc(m.x - m.r * 0.3, m.y - m.r * 0.25, m.r * 0.35, 0, TAU); ctx.fill();
  }
  for (const p of planktons) {
    const tw = (0.55 + Math.sin(t * 4 + p.ph) * 0.3) * clamp(p.life / 6, 0, 1);
    ctx.fillStyle = `rgba(170,240,255,${tw})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 + tw * 0.3), 0, TAU); ctx.fill();
  }
}

/* ---------- 척추 곡선 물고기 ---------- */
const SPINE_N = 7;
const BODY_PROF = [0.40, 0.50, 0.46, 0.36, 0.26, 0.16, 0.08]; // 머리→꼬리 반경 비율
function drawShrimp(f, t) {
  const g = f.genes;
  const s = 7 * g.size;
  const ang = Math.atan2(f.vy, f.vx || 0.01);
  const ca = Math.cos(ang), sa = Math.sin(ang);
  const px = -sa, py = ca;
  const depth = clamp(f.y / H, 0, 1);
  const hue = g.hue + depth * 10, sat = 58 - depth * 14, li = 62 - depth * 20;
  /* 몸통: 꼬리로 갈수록 작아지는 마디 */
  const wob = Math.sin(t * 9 + f.ph) * s * 0.25;
  for (let i = 4; i >= 0; i--) {
    const r = s * (0.5 - i * 0.07);
    if (r < 0.5) continue;
    const bx = f.x - ca * i * s * 0.42 + px * (wob * i / 4);
    const by = f.y - sa * i * s * 0.42 + py * (wob * i / 4);
    ctx.fillStyle = `hsla(${hue},${sat}%,${li - i * 2}%,0.9)`;
    ctx.beginPath(); ctx.arc(bx, by, r, 0, TAU); ctx.fill();
  }
  /* 더듬이 */
  ctx.strokeStyle = `hsla(${hue},${sat}%,${li + 12}%,0.7)`; ctx.lineWidth = 0.8;
  for (const sgn of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(f.x + ca * s * 0.4, f.y + sa * s * 0.4);
    ctx.quadraticCurveTo(
      f.x + ca * s * 1.3 + px * sgn * s * 0.4, f.y + sa * s * 1.3 + py * sgn * s * 0.4,
      f.x + ca * s * 2.0 + px * sgn * s * 0.9, f.y + sa * s * 2.0 + py * sgn * s * 0.9);
    ctx.stroke();
  }
}
function drawJelly(f, t) {
  const g = f.genes;
  const s = 13 * g.size;
  const pulse = 1 + Math.sin(f.age * 2.2 + f.ph) * 0.12;
  const depth = clamp(f.y / H, 0, 1);
  const hue = g.hue, sat = 55 - depth * 15, li = 72 - depth * 18;
  /* 촉수 */
  ctx.strokeStyle = `hsla(${hue},${sat}%,${li}%,0.45)`; ctx.lineWidth = 1.2;
  for (let k = -2; k <= 2; k++) {
    const sway = Math.sin(t * 1.8 + f.ph + k) * s * 0.3;
    ctx.beginPath();
    ctx.moveTo(f.x + k * s * 0.28, f.y + s * 0.1);
    ctx.quadraticCurveTo(
      f.x + k * s * 0.34 + sway, f.y + s * 0.9,
      f.x + k * s * 0.3 + sway * 1.6, f.y + s * 1.7);
    ctx.stroke();
  }
  /* 우산 */
  ctx.fillStyle = `hsla(${hue},${sat}%,${li}%,0.4)`;
  ctx.beginPath();
  ctx.ellipse(f.x, f.y, s * pulse, s * 0.72 / pulse, 0, Math.PI, TAU);
  ctx.fill();
  ctx.fillStyle = `hsla(${hue},${sat - 10}%,${li + 14}%,0.5)`;
  ctx.beginPath();
  ctx.ellipse(f.x, f.y - s * 0.08, s * 0.6 * pulse, s * 0.42 / pulse, 0, Math.PI, TAU);
  ctx.fill();
}
function drawFish(f, t, kind) {
  const g = f.genes;
  const s = (kind === 'pred' ? 15 : 9.5) * g.size;
  const spd = Math.hypot(f.vx, f.vy);
  const sf = clamp(spd / 55, 0.25, 1.8);

  /* 진행 방향 (스무딩) */
  if (spd > 4) {
    const target = Math.atan2(f.vy, f.vx);
    let d = target - (f.heading || 0);
    while (d > Math.PI) d -= TAU;
    while (d < -Math.PI) d += TAU;
    f.heading = (f.heading || 0) + d * 0.12;
  }
  const ang = f.heading || 0;
  const ca = Math.cos(ang), sa = Math.sin(ang);
  const px = -sa, py = ca; // 수직 방향

  /* 척추 포인트: 머리에서 꼬리로 진행파 */
  const freq = (kind === 'pred' ? 6.5 : 8.5) * (0.6 + 0.5 * sf);
  const amp = s * 0.30 * (0.5 + 0.7 * sf);
  const pts = [];
  for (let i = 0; i < SPINE_N; i++) {
    const dd = i / (SPINE_N - 1);
    const along = s * 2.0 * dd;
    const wob = Math.sin(t * freq + f.ph - i * 1.05) * amp * dd;
    pts.push([f.x - ca * along + px * wob, f.y - sa * along + py * wob]);
  }

  /* 깊이 색: 깊을수록 어둡고 푸르게 */
  const depth = clamp(f.y / H, 0, 1);
  const hue = g.hue + depth * 12;
  const sat = (kind === 'pred' ? 62 : 55) - depth * 16;
  const li = ((kind === 'pred' ? 62 : 68) - depth * 22);

  /* 몸통 — 척추를 따라 좁아지는 원들 */
  for (let i = SPINE_N - 1; i >= 0; i--) {
    const r = s * BODY_PROF[i];
    if (r < 0.6) continue;
    const shade = li + (i === 0 ? 6 : 0) - i * 1.5;
    ctx.fillStyle = `hsla(${hue},${sat}%,${shade}%,0.97)`;
    ctx.beginPath();
    ctx.arc(pts[i][0], pts[i][1], r, 0, TAU);
    ctx.fill();
  }
  /* 배꼽 밝은면 — 아래쪽으로 살짝 치우친 작은 원들 */
  for (let i = SPINE_N - 3; i >= 0; i--) {
    const r = s * BODY_PROF[i] * 0.62;
    if (r < 0.5) continue;
    ctx.fillStyle = `hsla(${hue},${Math.max(sat - 14, 8)}%,${li + 15}%,0.5)`;
    ctx.beginPath();
    ctx.arc(pts[i][0] + px * r * 0.45, pts[i][1] + py * r * 0.45, r, 0, TAU);
    ctx.fill();
  }
  /* 등지느러미 */
  const d1 = pts[1], d2 = pts[3];
  ctx.fillStyle = `hsla(${hue},${sat}%,${li - 14}%,0.85)`;
  ctx.beginPath();
  ctx.moveTo(d1[0], d1[1]);
  ctx.quadraticCurveTo(
    (d1[0] + d2[0]) / 2 - px * s * 0.72, (d1[1] + d2[1]) / 2 - py * s * 0.72,
    d2[0] - px * s * 0.1, d2[1] - py * s * 0.1);
  ctx.closePath(); ctx.fill();
  /* 꼬리지느러미 — 척추 끝에서 더 크게 흔들림 */
  const tail = pts[SPINE_N - 1], pre = pts[SPINE_N - 2];
  const ta = Math.atan2(tail[1] - pre[1], tail[0] - pre[0]);
  const twag = Math.sin(t * freq + f.ph - SPINE_N * 1.05) * 0.7;
  const tca = Math.cos(ta), tsa = Math.sin(ta);
  const tpx = -tsa, tpy = tca;
  const tl = s * 0.85, twd = s * 0.42;
  ctx.fillStyle = `hsla(${hue},${sat}%,${li - 10}%,0.9)`;
  ctx.beginPath();
  ctx.moveTo(tail[0], tail[1]);
  ctx.quadraticCurveTo(
    tail[0] - tca * tl * 0.6 + tpx * twd * (1 + twag), tail[1] - tsa * tl * 0.6 + tpy * twd * (1 + twag),
    tail[0] - tca * tl + tpx * twd * 0.4 * (1 + twag * 1.4), tail[1] - tsa * tl + tpy * twd * 0.4 * (1 + twag * 1.4));
  ctx.quadraticCurveTo(
    tail[0] - tca * tl * 0.72, tail[1] - tsa * tl * 0.72,
    tail[0] - tca * tl - tpx * twd * 0.4 * (1 - twag * 1.4), tail[1] - tsa * tl - tpy * twd * 0.4 * (1 - twag * 1.4));
  ctx.quadraticCurveTo(
    tail[0] - tca * tl * 0.6 - tpx * twd * (1 - twag), tail[1] - tsa * tl * 0.6 - tpy * twd * (1 - twag),
    tail[0], tail[1]);
  ctx.fill();
  /* 가슴지느러미 */
  const hp = pts[1];
  const finA = Math.sin(t * freq * 1.4 + f.ph) * 0.5;
  ctx.fillStyle = `hsla(${hue},${sat}%,${li - 6}%,0.75)`;
  ctx.beginPath();
  ctx.moveTo(hp[0] + px * s * 0.2, hp[1] + py * s * 0.2);
  ctx.quadraticCurveTo(
    hp[0] + px * s * (0.75 + finA * 0.2) - ca * s * 0.25, hp[1] + py * s * (0.75 + finA * 0.2) - sa * s * 0.25,
    hp[0] + px * s * 0.28 - ca * s * 0.42, hp[1] + py * s * 0.28 - sa * s * 0.42);
  ctx.closePath(); ctx.fill();
  /* 눈 */
  const ex = pts[0][0] + ca * s * 0.30 + px * s * 0.14;
  const ey = pts[0][1] + sa * s * 0.30 + py * s * 0.14;
  ctx.fillStyle = 'rgba(8,18,28,0.92)';
  ctx.beginPath(); ctx.arc(ex, ey, s * 0.095, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath(); ctx.arc(ex + s * 0.03, ey - s * 0.03, s * 0.034, 0, TAU); ctx.fill();
  /* 아가미 */
  ctx.strokeStyle = `hsla(${hue},${sat}%,${li - 24}%,0.45)`;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(pts[0][0] - ca * s * 0.05, pts[0][1] - sa * s * 0.05, s * 0.26, ang + 1.9, ang + 4.4);
  ctx.stroke();
}

function drawBubbles() {
  ctx.strokeStyle = 'rgba(180,225,250,0.4)';
  ctx.lineWidth = 1;
  for (const b of bubbles) {
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.stroke();
    ctx.fillStyle = 'rgba(220,240,255,0.25)';
    ctx.beginPath(); ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.3, 0, TAU); ctx.fill();
  }
}

/* ---------- HUD ---------- */
/* ---------- DOM 갱신 시그니처 캐시 (v1.3 성능) — 내용이 같으면 innerHTML 재작성 생략 ---------- */
const _sigCache = {};
function sigRedraw(key, sig, fn) {

function fitCanvas(cv, hCss) {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = cv.clientWidth || (window.innerWidth - 32);
  /* 크기가 같으면 백링 스토어 재할당을 건너뛰고 지우기만 (소프트웨어 렌더링 비용 절감) */
  if (cv.width !== w * dpr || cv.height !== hCss * dpr) {
    cv.width = w * dpr; cv.height = hCss * dpr;
    cv.style.height = hCss + 'px';
  }
  const c = cv.getContext('2d');
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  c.clearRect(0, 0, w, hCss);
  return [c, w, hCss];
}

function drawLineChart() {
  const cv = document.getElementById('chLine');
  const [c, w, h] = fitCanvas(cv, 132);
  const padL = 30, padB = 16, padT = 8, padR = 8;
  const n = hist.a.length;
  let maxV = 10;
  for (const s of SERIES) for (const v of hist[s.key]) if (v > maxV) maxV = v;
  maxV = Math.ceil(maxV * 1.15 / 10) * 10;
  /* 격자 */
  c.strokeStyle = 'rgba(120,190,230,0.12)'; c.lineWidth = 1;
  c.fillStyle = 'rgba(140,190,215,0.6)'; c.font = '10px sans-serif'; c.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const y = padT + (h - padT - padB) * i / 4;
    c.beginPath(); c.moveTo(padL, y); c.lineTo(w - padR, y); c.stroke();
    c.fillText(Math.round(maxV * (4 - i) / 4), padL - 5, y + 3);
  }
  const x0 = padL, x1 = w - padR;
  for (const s of SERIES) {
    const arr = hist[s.key];
    if (arr.length < 2) continue;
    const stride = Math.max(1, Math.ceil(arr.length / 150));
    c.strokeStyle = s.color; c.lineWidth = 1.8; c.lineJoin = 'round';
    c.beginPath();
    for (let i = 0; i < arr.length; i += stride) {
      const px = x0 + (x1 - x0) * (i / (HIST_MAX - 1));
      const y = padT + (h - padT - padB) * (1 - arr[i] / maxV);
      if (i === 0) c.moveTo(px, y); else c.lineTo(px, y);
    }
    c.stroke();
    /* 현재값 점 */
    const lx = x0 + (x1 - x0) * ((arr.length - 1) / (HIST_MAX - 1));
    const ly = padT + (h - padT - padB) * (1 - arr[arr.length - 1] / maxV);
    c.fillStyle = s.color;
    c.beginPath(); c.arc(lx, ly, 3, 0, TAU); c.fill();
  }
  document.getElementById('lineLeg').innerHTML = SERIES.map(s =>
    `<span><span class="dot" style="background:${s.color}"></span>${s.name} ${hist[s.key].length ? hist[s.key][hist[s.key].length - 1] : 0}</span>`).join('');
}

function biomass(tk) {

  for (const q of tk.algae) a += q.e * 0.25;
  for (const f of tk.herbs) h += 9 * f.genes.size ** 3;
  for (const f of tk.preds) p += 42 * f.genes.size ** 3;
  for (const f of tk.shrimps) sh += 3 * f.genes.size ** 3;

  let totalBirths = 0, alive = 0;
  for (const e of entries) { totalBirths += e.births; if (e.extinct === null) alive++; }
  const sig = entries.length + ':' + totalBirths + ':' + alive + ':' + env.day;
  if (_sigCache.ltree === sig) return;
  _sigCache.ltree = sig;
  const cv = document.getElementById('chLines');
  const SHOW = 16;
  const shown = entries.slice(-SHOW);
  const laneH = 17, padT = 18, padB = 12, labelW = 62;
  const hCss = Math.max(58, padT + shown.length * laneH + padB);
  const [c, w, h] = fitCanvas(cv, hCss);
  if (!shown.length) {
    c.fillStyle = 'rgba(95,150,181,0.8)'; c.font = '11px sans-serif'; c.textAlign = 'left';
    c.fillText('혈통이 생기면 여기에 시간의 흐름이 그려집니다', 6, 24);
    document.getElementById('linesLeg').innerHTML = '';
    return;
  }
  let d0 = shown[0].founded;
  for (const e of shown) if (e.founded < d0) d0 = e.founded;
  const d1 = Math.max(env.day, d0 + 1);
  const x = d => labelW + (w - labelW - 10) * (d - d0) / (d1 - d0);
  c.strokeStyle = 'rgba(120,190,230,0.15)'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(labelW, padT - 6); c.lineTo(w - 8, padT - 6); c.stroke();
  c.fillStyle = 'rgba(95,150,181,0.9)'; c.font = '9px sans-serif';
  c.textAlign = 'left'; c.fillText(d0 + '일', labelW, padT - 9);
  c.textAlign = 'right'; c.fillText(d1 + '일 (오늘)', w - 8, padT - 9);
  for (let i = 0; i < shown.length; i++) {
    const e = shown[i];
    const y = padT + i * laneH + laneH / 2;
    const col = LINE_KIND_COLOR[e.kind] || '#8fb4c8';
    const dead = e.extinct !== null;
    c.fillStyle = dead ? 'rgba(143,180,200,0.55)' : '#dceef8';
    c.font = '9.5px sans-serif'; c.textAlign = 'left';
    c.fillText(e.line.length > 5 ? e.line.slice(0, 5) + '…' : e.line, 2, y + 3);
    const x0 = x(e.founded), x1 = Math.max(x(dead ? e.extinct : env.day), x0 + 2);
    c.strokeStyle = col; c.globalAlpha = dead ? 0.35 : 0.9; c.lineWidth = dead ? 2 : 3;
    c.beginPath(); c.moveTo(x0, y); c.lineTo(x1, y); c.stroke();
    c.globalAlpha = 1;
    if (dead) {
      c.fillStyle = 'rgba(240,145,138,0.85)'; c.font = '9px sans-serif'; c.textAlign = 'left';
      c.fillText('✕', x1 + 3, y + 3);
    } else {
      c.fillStyle = col; c.beginPath(); c.arc(x1, y, 3, 0, TAU); c.fill();
    }
    c.fillStyle = dead ? 'rgba(143,180,200,0.5)' : 'rgba(220,238,248,0.75)';
    c.font = '8.5px sans-serif'; c.textAlign = 'right';
    c.fillText(e.maxGen + '대', x1 - 5, y - 4);
  }
  const more = entries.length - shown.length;
  document.getElementById('linesLeg').innerHTML =
    '<span><span class="dot" style="background:#dceef8"></span>살아 있는 혈통 ' + alive + '개</span>' +
    '<span><span class="dot" style="background:rgba(240,145,138,0.85)"></span>대가 끊긴 혈통 ' + (entries.length - alive) + '개</span>' +
    (more > 0 ? '<span>최근 ' + SHOW + '개 · 외 ' + more + '개</span>' : '');
}

function drawTankCompare() {
  const sec = document.getElementById('tankCmpSec');
  if (!tanks[1].open) { sec.style.display = 'none'; return; }
  sec.style.display = '';
  const sig = [tanks[0].herbs.length, tanks[1].herbs.length, tanks[0].preds.length, tanks[1].preds.length,
    tanks[0].st.births, tanks[1].st.births, tanks[0].st.deaths, tanks[1].st.deaths,
    Math.round(tanks[0].env.oxygen * 100), Math.round(tanks[1].env.oxygen * 100),
    tanks[0].algae.length, tanks[1].algae.length, stats.migrations || 0, waterway ? 1 : 0].join(',');
  if (_sigCache.tcmp === sig) return;
  _sigCache.tcmp = sig;
  const cnt = tk => tk.herbs.length + tk.preds.length + tk.shrimps.length + tk.jellies.length + tk.apexes.length;
  const bio = tk => Math.round(biomass(tk).reduce((s, d) => s + d.v, 0));
  const row = (label, f) => `<div class="row"><span>${label}</span><b>${f(tanks[0])} · ${f(tanks[1])}</b></div>`;
  document.getElementById('tankCmp').innerHTML =
    row('개체 수', tk => cnt(tk) + '마리') +
    row('조류', tk => tk.algae.length) +
    row('초식 / 포식 / 대형', tk => tk.herbs.length + ' / ' + tk.preds.length + ' / ' + tk.apexes.length) +
    row('새우 / 해파리', tk => tk.shrimps.length + ' / ' + tk.jellies.length) +
    row('생물량', tk => bio(tk)) +
    row('산소 · 수온', tk => Math.round(tk.env.oxygen * 100) + '% · ' + tk.env.temp.toFixed(1) + '°C') +
    row('누적 탄생 / 죽음 / 사냥', tk => tk.st.births + ' / ' + tk.st.deaths + ' / ' + tk.st.hunts) +
    `<div class="row"><span>연결 수로</span><b>${waterway ? '열림 · 이주 ' + (stats.migrations || 0) + '회' : '닫힘'}</b></div>`;
}
function drawDash() {
  drawTankCompare();
  drawAch();
  drawChron();
  drawLineTree();
  drawDex();
  drawEnvStats();
  drawEnvChart();
  drawLineChart();
  drawPie();
  drawGenStats();
  renderLogChips();
  renderDashLog();
}
setInterval(() => { if (dashOpen) drawDash(); }, 500);
if (location.hash === '#dash') {
  dashOpen = true;
  dashEl.classList.add('open'); btnDash.classList.add('on');
  setTimeout(drawDash, 800);
}

/* ---------- 저장 UI · 자동저장 (v0.6) ---------- */
const saveModalEl = document.getElementById('saveModal');
const saveBoxEl = document.getElementById('saveBox');
function slotSummary(d) {
  if (d === 'corrupt') return '손상된 데이터 (자동 격리됨)';
  if (!d) return '비어 있음';
  const day = Math.floor((d.env.t || 0) / DAY_LEN);
  const when = new Date(d.savedAt);
  const mm = (when.getMonth() + 1) + '/' + when.getDate() + ' ' + String(when.getHours()).padStart(2, '0') + ':' + String(when.getMinutes()).padStart(2, '0');
  return day + '일차 · 도감 ' + (d.codex ? d.codex.length : 0) + '종 · ' + mm + ' 저장';
}
function renderSaveBox() {
  const cur = activeSlot();
  let html = '<h2>저장 관리</h2>';
  for (let n = 1; n <= 3; n++) {
    const d = readSlot(n);
    const has = d && d !== 'corrupt';
    html += `<div class="slot"><div class="st"><span>슬롯 ${n}${n === cur ? ' · 사용 중' : ''}</span><span>` +
      `<button class="sbtn" data-save="${n}">여기에 저장</button>` +
      (has ? `<button class="sbtn" data-load="${n}">불러오기</button>` : '') +
      `</span></div><div class="si">${slotSummary(d)}</div></div>`;
  }
  html += `<div class="foot"><button class="sbtn warn" id="btnNewTank">새 수족관</button><button class="sbtn" id="btnSaveClose">닫기</button></div>`;
  saveBoxEl.innerHTML = html;
  for (const b of saveBoxEl.querySelectorAll('[data-save]')) b.addEventListener('click', () => {
    try {
      localStorage.setItem(SAVE_KEY(+b.dataset.save), serialize());
      localStorage.setItem(SLOT_KEY, b.dataset.save);
    } catch {}
    renderSaveBox();
  });
  for (const b of saveBoxEl.querySelectorAll('[data-load]')) b.addEventListener('click', () => {
    suppressExitSave = true; /* 나가며 저장이 불러올 슬롯을 덮어쓰지 않게 */
    try { localStorage.setItem(SLOT_KEY, b.dataset.load); } catch {}
    location.reload();
  });
  let newArmed = false;
  document.getElementById('btnNewTank').addEventListener('click', ev => {
    if (!newArmed) { newArmed = true; ev.target.textContent = '정말 초기화 — 한 번 더'; return; }
    suppressExitSave = true;
    try { localStorage.removeItem(SAVE_KEY(activeSlot())); } catch {}
    location.reload();
  });
  document.getElementById('btnSaveClose').addEventListener('click', () => saveModalEl.classList.remove('show'));
}
document.getElementById('btnSave').addEventListener('click', () => {
  renderSaveBox();
  saveModalEl.classList.add('show');
});
saveModalEl.addEventListener('click', e => { if (e.target === saveModalEl) saveModalEl.classList.remove('show'); });

/* 자동 저장: 15초 간격 + 페이지를 떠날 때 (슬롯 전환·초기화 직후에는 나가며 저장하지 않음) */
let suppressExitSave = false;
if (!IS_SIM) {
  setInterval(() => { if (!suppressExitSave) try { localStorage.setItem(SAVE_KEY(activeSlot()), serialize()); } catch {} }, 15000);
  window.addEventListener('pagehide', () => { if (!suppressExitSave) try { localStorage.setItem(SAVE_KEY(activeSlot()), serialize()); } catch {} });
}

/* ---------- 메인 루프 ---------- */
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min((now - last) / 1000, 0.1);
  last = now;
  if (dt > 0) fpsEma = fpsEma * 0.95 + (1 / dt) * 0.05;
  if (!paused) {
    const sdt = dt * speed;
    const steps = speed > 4 ? 4 : speed > 2 ? 2 : 1; // 고속일 때 나눠 안정성 확보 (타임랩스 8× 포함)
    bindTank(tanks[viewTank]);
    for (let s = 0; s < steps; s++) step(sdt / steps);
    /* 다른 수조도 계속 살아 간다 — 화면 밖 수조는 모은 시간을 덩어리로 따라잡아 부담을 줄임 (v1.9) */
    if (tanks[1].open) {
      const o = tanks[1 - viewTank];
      o.acc += sdt;
      let it = 0;
      bindTank(o);
      while (o.acc >= 0.05 && it < 8) { const d2 = Math.min(o.acc, 0.25); step(d2); o.acc -= d2; it++; }
      if (o.acc > 1) o.acc = 1;
      bindTank(tanks[viewTank]);
    }
    migrationTick(sdt);
  }
  const t = env.t;
  drawBackground(t);
  drawPlants(t);
  drawDecorations(t);
  drawAlgae(t);
  drawDetritus();
  drawFeedPellets(t);
  for (const f of shrimps) drawShrimp(f, t);
  for (const f of jellies) drawJelly(f, t);
  for (const f of herbs) drawFish(f, t, 'herb');
  for (const f of preds) drawFish(f, t, 'pred');
  for (const f of apexes) drawFish(f, t, 'pred');
  drawBubbles();

  /* 선택 개체 강조 링 (v0.5) */
  if (selFish && (herbs.includes(selFish) || preds.includes(selFish) || shrimps.includes(selFish) || jellies.includes(selFish) || apexes.includes(selFish))) {
    const rr = 16 * selFish.genes.size + 6;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,235,160,0.85)'; ctx.lineWidth = 1.6;
    ctx.setLineDash([5, 4]); ctx.lineDashOffset = -env.t * 20;
    ctx.beginPath(); ctx.arc(selFish.x, selFish.y, rr, 0, TAU); ctx.stroke();
    ctx.restore();
  }

  /* --- 낮밤 · 이벤트 분위기 (v0.4) --- */
  const _stint = seasonTint();
  if (_stint) { ctx.fillStyle = _stint; ctx.fillRect(0, 0, W, H); }
  if (env.bloom > 0) {
    ctx.fillStyle = `rgba(64,150,70,${0.10 * Math.min(1, env.bloom / 5)})`;
    ctx.fillRect(0, 0, W, H);
  }
  const nightA = (1 - env.light) * 0.52;
  if (nightA > 0.02) {
    ctx.fillStyle = `rgba(3,9,24,${nightA})`;
    ctx.fillRect(0, 0, W, H);
    /* 밤 반딧불 플랑크톤 */
    if (env.light < 0.3) {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < motes.length; i += 3) {
        const m = motes[i];
        const tw = Math.max(0, Math.sin(t * 1.7 + m.ph * 3));
        ctx.fillStyle = `rgba(140,230,200,${tw * 0.35})`;
        ctx.beginPath(); ctx.arc((m.x * W + Math.sin(t * 0.3 + m.ph) * 12), ((m.y * H + t * m.sp * 3) % H), m.r * 0.9, 0, TAU); ctx.fill();
      }
      ctx.restore();
    }
  }
  updateHud(dt);
}
requestAnimationFrame(frame);

/* ---------- ?sim=N : 개입 없는 장기 안정성 검증 훅 ---------- */
const simQ = new URLSearchParams(location.search).get('sim');
if (simQ) {
  const total = Math.min(parseInt(simQ, 10) || 0, 3600);
  let extTotal = 0; const extDays = []; const _addLog = addLog;
  addLog = function (m) { if (m.indexOf('사라졌다') >= 0) { extTotal++; extDays.push(env.day + '(' + m.slice(0, 12) + ')'); } _addLog(m); };
  if (new URLSearchParams(location.search).get('deco')) {
    for (let i = 0; i < 8; i++) { addDeco('rock', 30 + i * 46); addDeco('coral', 48 + i * 46); }
    for (let i = 0; i < 10; i++) addDeco('plant', 24 + i * 38);
  }
  if (new URLSearchParams(location.search).get('tanks') === '2') openTank2(); /* 두 수조 장기 안정성 검증 (v1.9) */
  const rec = { seconds: total, min: { a: 1e9, h: 1e9, p: 1e9, s: 1e9, j: 1e9, x: 1e9 }, max: { a: 0, h: 0, p: 0, s: 0, j: 0, x: 0 }, events: [], oxyMin: 1, tempMin: 99, tempMax: -99 };
  let evAcc = 0;
  for (let i = 0; i < total * 10; i++) {
    bindTank(tanks[0]); step(0.1);
    if (tanks[1].open) {
      bindTank(tanks[1]); step(0.1);
      migrationTick(0.1);
      if (i % 10 === 0) rec.oxyMin = Math.min(rec.oxyMin, tanks[1].env.oxygen);
    }
    if (i % 10 === 0) {
      rec.min.a = Math.min(rec.min.a, algae.length); rec.max.a = Math.max(rec.max.a, algae.length);
      rec.min.h = Math.min(rec.min.h, herbs.length); rec.max.h = Math.max(rec.max.h, herbs.length);
      rec.min.p = Math.min(rec.min.p, preds.length); rec.max.p = Math.max(rec.max.p, preds.length);
      rec.min.s = Math.min(rec.min.s, shrimps.length); rec.max.s = Math.max(rec.max.s, shrimps.length);
      rec.min.j = Math.min(rec.min.j, jellies.length); rec.max.j = Math.max(rec.max.j, jellies.length);
      rec.min.x = Math.min(rec.min.x, apexes.length); rec.max.x = Math.max(rec.max.x, apexes.length);
      rec.oxyMin = Math.min(rec.oxyMin, env.oxygen);
      rec.tempMin = Math.min(rec.tempMin, env.temp); rec.tempMax = Math.max(rec.tempMax, env.temp);
    }
  }
  bindTank(tanks[0]);
  rec.final = { a: algae.length, h: herbs.length, p: preds.length, s: shrimps.length, j: jellies.length, x: apexes.length, day: env.day, oxygen: Math.round(env.oxygen * 100) / 100, temp: Math.round(env.temp * 10) / 10, nutrients: Math.round(env.nutrients * 100) / 100 };
  rec.tank2 = tanks[1].open ? { a: tanks[1].algae.length, h: tanks[1].herbs.length, p: tanks[1].preds.length, s: tanks[1].shrimps.length, j: tanks[1].jellies.length, x: tanks[1].apexes.length, oxygen: Math.round(tanks[1].env.oxygen * 100) / 100, temp: Math.round(tanks[1].env.temp * 10) / 10 } : null;
  rec.migrations = stats.migrations || 0;
  rec.events = logs.map(l => l.d + '일: ' + l.msg);
  rec.chron = chronicle.map(c => c.d + '일: ' + c.msg);
  rec.extTotal = extTotal; rec.extDays = extDays;
  rec.stats = stats;
  window.__simReport = rec;
  document.title = '[sim] ' + JSON.stringify(rec.final);
  const pre = document.createElement('pre'); pre.id = 'simout'; pre.textContent = JSON.stringify(rec); document.body.appendChild(pre);
}
</script>
